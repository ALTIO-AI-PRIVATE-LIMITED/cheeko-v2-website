<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<!-- Cheeko hero showreel, version A (our pipeline, 2026-10-01). 1440x1080 (4:3, the website hero box), 24 s at 120 BPM,
     loops: the last half second wipes back into frame 0. window.render(t) draws frame t; window.ready waits for fonts/images. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@700;800;900&family=Hanken+Grotesk:wght@600;800&display=block">
<style>
:root{--brand:#F0521D;--sun:#FFC81A;--ink:#231A10;--tint:#FFF4E3;--purple:#6C3DFF;--green:#2F6B4F;--pink:#FFA9C9;
  --disp:"Gabarito",sans-serif;--body:"Hanken Grotesk",sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1440px;height:1080px;overflow:hidden;background:#000}
#stage{position:relative;width:1440px;height:1080px;overflow:hidden;background:var(--sun)}
.shot{position:absolute;inset:0;overflow:hidden;visibility:hidden;z-index:0}
.abs{position:absolute}
.full{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shade::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(10,8,6,0) 50%,rgba(10,8,6,.6) 90%);z-index:1}
.ray{position:absolute;width:3000px;height:3000px;margin:-1500px 0 0 -1500px;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.22) 0 10deg,rgba(255,255,255,0) 10deg 20deg)}
.dev{position:absolute;transform-origin:50% 100%}
.dev>img.d{position:absolute;inset:0;width:100%;height:100%;filter:drop-shadow(0 26px 36px rgba(0,0,0,.28))}
.scr{position:absolute;left:16.19%;top:7.71%;width:65.26%;height:32.5%;overflow:hidden;background:#1D1A17}
.scr img{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;visibility:hidden}
.scr img.art{object-fit:cover;object-position:50% 12%}
.card{position:absolute;object-fit:cover;border:6px solid #fff;border-radius:20px;box-shadow:0 14px 28px rgba(0,0,0,.25)}
.knob{position:absolute;border-radius:50%}
.ripple{position:absolute;border:9px solid #fff;border-radius:50%;opacity:0;pointer-events:none}
#caps{position:absolute;left:60px;right:60px;bottom:70px;z-index:50;text-align:center;font-family:var(--disp);font-weight:900;font-size:84px;line-height:1.1}
#caps .w{display:inline-block;color:#fff;margin:0 .1em;paint-order:stroke fill;-webkit-text-stroke:14px var(--ink);text-shadow:0 8px 0 rgba(35,26,16,.35)}
#caps .w.hl{color:var(--ink);-webkit-text-stroke:0;background:var(--sun);border-radius:.18em;padding:0 .14em;text-shadow:none;box-shadow:0 8px 0 rgba(35,26,16,.35)}
#caps .w.emo{-webkit-text-stroke:0;text-shadow:none;background:none;box-shadow:none}
.bub{position:absolute;z-index:45;width:max-content;max-width:640px;padding:22px 32px 24px;border-radius:40px;font-family:var(--disp);font-weight:800;font-size:50px;line-height:1.14;color:var(--ink);box-shadow:0 16px 36px rgba(0,0,0,.28);visibility:hidden}
.bub .who{display:inline-block;font-size:30px;font-weight:900;padding:5px 18px;border-radius:99px;margin-bottom:8px;color:#fff}
.bub:after{content:"";position:absolute;width:40px;height:40px;background:inherit;transform:rotate(45deg);border-radius:6px}
.bub.l:after{bottom:-14px;left:70px}
.bub.r:after{bottom:-14px;right:70px}
.pol{position:absolute;padding:14px;background:#fff;border-radius:22px;box-shadow:0 24px 48px rgba(0,0,0,.3)}
.pol img{display:block;width:100%;height:100%;object-fit:cover;border-radius:10px}
.popart{position:absolute;border:12px solid #fff;border-radius:30px;box-shadow:0 24px 50px rgba(0,0,0,.35);object-fit:cover}
.conf{position:absolute;left:0;top:0;width:22px;height:14px;border-radius:3px;opacity:0}
.stamp{position:absolute;font-family:var(--disp);font-weight:900;font-size:70px;line-height:1;padding:10px 24px 6px;border:9px solid var(--brand);color:var(--brand);border-radius:22px;text-transform:uppercase;background:rgba(255,255,255,.94);white-space:nowrap;box-shadow:0 16px 36px rgba(0,0,0,.25)}
.big{position:absolute;left:0;right:0;text-align:center;font-family:var(--disp);font-weight:900;color:#fff;line-height:1.02;paint-order:stroke fill;-webkit-text-stroke:16px var(--ink);text-shadow:0 10px 0 rgba(35,26,16,.35)}
.big .hl{color:var(--ink);-webkit-text-stroke:0;background:var(--sun);border-radius:.14em;padding:0 .12em;text-shadow:none}
.dark{background:radial-gradient(110% 90% at 40% 45%,#3A2414 0%,#1A120C 55%,#0E0A07 100%)}
.glow{position:absolute;width:1000px;height:1000px;margin:-500px 0 0 -500px;border-radius:50%;background:radial-gradient(circle,rgba(240,82,29,.45),rgba(240,82,29,0) 62%)}
.iph{position:absolute;background:linear-gradient(135deg,#5f5c58 0%,#c9c5be 18%,#efece6 30%,#a9a59f 46%,#6d6a66 62%,#d6d2cb 80%,#77746f 100%);box-shadow:0 50px 100px rgba(0,0,0,.45),0 0 0 1.5px rgba(0,0,0,.35)}
.iph .bz{position:absolute;background:#040404;box-shadow:inset 0 0 0 1.5px #1c1c1e}
.iph .ps{position:absolute;overflow:hidden;background:#fff}
.iph .ps img{position:absolute;left:0;top:0;width:100%;display:block}
.iph .isl{position:absolute;background:#000;z-index:5}
.iph .gl{position:absolute;pointer-events:none;z-index:6;background:linear-gradient(118deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.05) 22%,rgba(255,255,255,0) 38%)}
.side{position:absolute;font-family:var(--disp);font-weight:900;color:#fff;line-height:1.02}
.side .hl{color:var(--ink);background:var(--sun);border-radius:.14em;padding:0 .12em}
</style>
<script src="mask.js"></script>
</head>
<body><div id="stage"><div id="caps"></div></div>
<script>
const $ = s => document.querySelector(s);
const clamp = (x,a=0,b=1) => Math.min(b, Math.max(a, x));
const prog = (t,a,b) => clamp((t-a)/(b-a));
const eOut = x => 1 - Math.pow(1-x, 3);
const eIn = x => x*x;
const eIO = x => x < .5 ? 4*x*x*x : 1 - Math.pow(-2*x+2, 3)/2;
const eBack = x => { const c=2.1, d=c+1; return 1 + d*Math.pow(x-1,3) + c*Math.pow(x-1,2); };
const lerp = (a,b,x) => a + (b-a)*x;
const vis = (el, on) => el.style.visibility = on ? 'inherit' : 'hidden';
const popS = (t, t0, dur=.3) => t < t0 ? 0 : lerp(.3, 1, eBack(prog(t, t0, t0+dur)));
function seeded(s){ return () => (s = (s*16807) % 2147483647) / 2147483647; }
const IMG = '../../assets/img/';
const DUR = 24, W = 1440, H = 1080;
const stage = $('#stage');
const el = (tag, cls, html, parent) => { const d = document.createElement(tag); if (cls) d.className = cls; if (html != null) d.innerHTML = html; (parent||stage).appendChild(d); return d; };
const fw = n => IMG + 'fw-screens/' + n + '.png';
document.querySelectorAll('style')[0].sheet.insertRule(`.scr{-webkit-mask:url(${window.MASKURI}) 0 0/100% 100% no-repeat;mask:url(${window.MASKURI}) 0 0/100% 100% no-repeat}`, 0);
const COLORS = ['#F0521D','#FFC81A','#6C3DFF','#2F6B4F','#FFA9C9','#FFFFFF'];
function confetti(host, n, seed) {
  const r = seeded(seed), parts = [];
  for (let i=0;i<n;i++) { const d = el('div','conf',null,host); d.style.background = COLORS[i%6];
    const a = -Math.PI/2 + (r()-.5)*2.6, v = 900 + r()*1300; parts.push({d, vx:Math.cos(a)*v, vy:Math.sin(a)*v, spin:(r()-.5)*1400, w:.6+r()*.8}); }
  return (t, t0, x0, y0) => { const dt = t - t0; for (const p of parts) { if (dt < 0 || dt > 2.2) { p.d.style.opacity = 0; continue; }
    const dr = (1-Math.exp(-dt*1.6))/1.6; p.d.style.opacity = clamp((2.2-dt)/.5);
    p.d.style.transform = `translate(${x0+p.vx*dr}px,${y0+p.vy*dr+500*dt*dt}px) rotate(${p.spin*dt}deg) scale(${p.w},${Math.cos(dt*9+p.spin)})`; } };
}
// rays turn exactly 27 pattern periods (20 deg each) in 24 s, so the loop is seamless
const RAYSPD = 20 * 27 / DUR;

/* ---------- the new Cheeko (Sep 2026 renders), Night screens ---------- */
const DEVR = 3619 / 2162, KNOB = [.49, .571, .191];
function device(root, {W: DW, X, Y, color = 'yellow', screens = [], card = null, turns = [], presses = []}) {
  const DHh = DW * DEVR, g = {};
  if (card) { g.card = el('img', 'card', null, root); g.card.src = IMG + card.src;
    g.cw = DW * .68; g.ch = g.cw * 1196 / 760; Object.assign(g.card.style, {width: g.cw + 'px', height: g.ch + 'px', left: (X + DW * .47 - g.cw / 2) + 'px'}); }
  g.dev = el('div', 'dev', `<img class="d" src="${IMG}device-v2/${color}_front.png"><div class="scr"></div>`, root);
  Object.assign(g.dev.style, {left: X + 'px', top: Y + 'px', width: DW + 'px', height: DHh + 'px'});
  const scr = g.dev.querySelector('.scr');
  g.screens = screens.map(([t0, n]) => { const im = el('img', null, null, scr); im.src = n.includes('/') ? IMG + n : fw(n); if (n.includes('/')) im.classList.add('art'); return [t0, im]; });
  g.knob = el('img', 'knob', null, g.dev); g.knob.src = IMG + 'device-v2/web/knob.webp';
  Object.assign(g.knob.style, {left: (DW * (KNOB[0] - KNOB[2])) + 'px', top: (DHh * KNOB[1] - DW * KNOB[2]) + 'px', width: (DW * KNOB[2] * 2) + 'px', height: (DW * KNOB[2] * 2) + 'px'});
  g.rip = el('div', 'ripple', null, root);
  g.scrPt = [X + DW * (.1619 + .6526 / 2), Y + DHh * (.0771 + .325 / 2)];
  g.draw = (t, intro = 1) => {
    const cur = g.screens.filter(([t0]) => t >= t0).pop();
    g.screens.forEach(([, im]) => vis(im, false)); if (cur) vis(cur[1], true);
    let sq = 1; for (const [t0] of g.screens) sq += Math.sin(prog(t, t0, t0 + .22) * Math.PI) * .03;
    if (g.card) {   // glides down behind Cheeko into the back pocket, top third above the head
      const d = prog(t, card.t - .7, card.t), land = prog(t, card.t - .05, card.t + .2);
      const top = Y - g.ch * .3;
      g.card.style.opacity = t >= card.t - .7 ? clamp(prog(t, card.t - .7, card.t - .5)) : 0;
      g.card.style.top = lerp(top - g.ch * 1.1, top, eOut(d)) + 'px';
      g.card.style.transform = `rotate(${lerp(4, 0, eOut(d))}deg)`;
      sq += Math.sin(land * Math.PI) * .02;
    }
    g.dev.style.transform = `scale(${intro * (2 - sq)}, ${intro * sq})`;
    let rot = 0; for (const tt of turns) rot += 30 * eBack(prog(t, tt, tt + .3));
    g.knob.style.transform = `rotate(${rot}deg)`;
    g.rip.style.opacity = 0;
    for (const tp of [...turns, ...presses]) { const p = prog(t, tp, tp + .5); if (p > 0 && p < 1) { g.rip.style.opacity = 1 - p;
      const r = lerp(40, 140, eOut(p)); Object.assign(g.rip.style, {left: (X + DW * KNOB[0] - r) + 'px', top: (Y + DHh * KNOB[1] - r) + 'px', width: 2*r + 'px', height: 2*r + 'px'}); break; } }
  };
  return g;
}

/* iPhone body (from the feature template) */
function makeIphone(root, BW, x, y) {
  const fr = BW * .013, bz = BW * .032, off = fr + bz, SW = BW - 2*off, SH = SW * 852/393, BH = SH + 2*off, u = SW / 393;
  const rS = 55*u, rB = rS + bz, rF = rB + fr;
  const ph = el('div', 'iph', `<div class="bz" style="left:${fr}px;top:${fr}px;right:${fr}px;bottom:${fr}px;border-radius:${rB}px">
       <div class="ps" style="left:${bz}px;top:${bz}px;width:${SW}px;height:${SH}px;border-radius:${rS}px"></div>
       <div class="isl" style="left:${bz + SW/2 - 63*u}px;top:${bz + 11*u}px;width:${126*u}px;height:${37*u}px;border-radius:${19*u}px"></div>
       <div class="gl" style="left:${bz}px;top:${bz}px;width:${SW}px;height:${SH}px;border-radius:${rS}px"></div></div>`, root);
  Object.assign(ph.style, {left: x + 'px', top: y + 'px', width: BW + 'px', height: BH + 'px', borderRadius: rF + 'px'});
  return {ph, ps: ph.querySelector('.ps'), SW, SH, BH};
}

/* ---------- captions: [start, end, [[word, time, hl?], ...]] ---------- */
const CAPS = [
  [1.1, 2.95, [['Insert', 1.1], ['a', 1.35], ['card', 1.6, 1], ['✨', 1.8, 'emo']]],
  [3.4, 5.95, [['Stories', 3.4], ['play!', 3.7, 1], ['📖', 3.95, 'emo']]],
  [10.35, 13.45, [['Say', 10.35], ['it.', 10.55], ['See', 11.0], ['it', 11.2], ['drawn.', 11.45, 1], ['🎨', 12.05, 'emo']]],
  [13.9, 16.45, [['8', 13.9], ['games.', 14.15], ['All', 14.6], ['offline.', 14.85, 1], ['🎮', 15.3, 'emo']]],
];
const caps = $('#caps');
function drawCaps(t) {
  const c = CAPS.find(([a, b]) => t >= a && t < b);
  if (!c) { caps.innerHTML = ''; caps._c = null; return; }
  if (caps._c !== c) { caps._c = c; caps.innerHTML = c[2].map(([w, , h]) => `<span class="w${h === 1 ? ' hl' : ''}${h === 'emo' ? ' emo' : ''}">${w}</span>`).join(' '); }
  [...caps.children].forEach((s, i) => { const t0 = c[2][i][1]; s.style.visibility = t >= t0 ? 'inherit' : 'hidden';
    s.style.transform = `scale(${popS(t, t0, .25)})`; });
  caps.style.opacity = 1 - prog(t, c[1] - .15, c[1]);
}

/* ---------- shots ---------- */
// tr: how the shot comes in. circle = wipe from a point, whip = slide in from the right, lens = iris from the centre, card = slides up
const SHOTS = [
  {t: 0, key: 'hello'}, {t: 3, key: 'stories', tr: 'circle'}, {t: 6, key: 'talk', tr: 'whip'}, {t: 10, key: 'imagine', tr: 'lens'},
  {t: 13.5, key: 'games', tr: 'card'}, {t: 16.5, key: 'app', tr: 'whip'}, {t: 19.5, key: 'end', tr: 'circle'},
];
SHOTS.forEach((s, i) => { s.end = SHOTS[i + 1] ? SHOTS[i + 1].t : DUR; s.root = el('div', 'shot'); });
const S = Object.fromEntries(SHOTS.map(s => [s.key, s]));
const CUES = {shots: SHOTS.map(s => [s.t, s.key]), bubbles: [], cards: [], presses: [], flashes: [], stamps: [], pops: [], letters: [], outro: 20.6};

// 1. hello: Cheeko on sun yellow, a card glides into the back pocket, the screen wakes up
{ const r = S.hello.root; r.style.background = 'var(--sun)';
  const ray = el('div', 'ray', null, r); ray.style.left = '720px'; ray.style.top = '470px';
  const g = device(r, {W: 360, X: 720 - 360 * .47, Y: 175, screens: [[0, 'theme1_00_home_clock'], [.8, 'theme1_01_menu_1_talk'], [2.15, 'theme1_14_card_reveal_discover']],
    card: {t: 2.0, src: 'cards-shipping/01-tales-of-kindness.jpg'}, presses: [.75]});
  CUES.cards.push(2.0); CUES.presses.push(.75);
  S.hello.draw = t => { ray.style.transform = `rotate(${t * RAYSPD}deg)`; g.draw(t); };
}
// 2. stories: a real kid with a card (left), Cheeko playing the story (right)
{ const r = S.stories.root; r.style.background = 'var(--brand)';
  const ph = el('img', null, null, r); ph.src = IMG + 'shoot/DSC02786.jpg';
  Object.assign(ph.style, {position: 'absolute', left: 0, top: 0, width: '760px', height: '1080px', objectFit: 'cover', objectPosition: '50% 32%'});
  const ray = el('div', 'ray', null, r); ray.style.left = '1110px'; ray.style.top = '470px'; ray.style.clipPath = 'inset(0 0 0 1150px)';
  const g = device(r, {W: 330, X: 1100 - 330 * .47, Y: 205, screens: [[3, 'theme1_14_card_reveal_discover'], [3.5, 'cards-shipping/01-tales-of-kindness.jpg']],
    card: {t: 2.9, src: 'cards-shipping/01-tales-of-kindness.jpg'}});
  S.stories.draw = t => { ph.style.transform = `scale(${lerp(1.12, 1.02, prog(t, 3, 6))})`; ray.style.transform = `rotate(${t * RAYSPD}deg)`; g.draw(t); };
}
// 3. talk: a real kid asks, Cheeko answers
{ const r = S.talk.root; r.classList.add('shade');
  const ph = el('img', 'full', null, r); ph.src = IMG + 'shoot/DSC03232.jpg'; ph.style.objectPosition = '50% 6%';
  const g = device(r, {W: 250, X: 1130, Y: 300, screens: [[6, 'theme1_03_talk_1_cheeko_4_listening'], [8.0, 'theme1_03_talk_1_cheeko_6_talking']], presses: [6.35]});
  CUES.presses.push(6.35);
  const q = el('div', 'bub l', `<span class="who" style="background:var(--purple)">🧒 Kid</span><br>Why is the sky blue? 🤔`, r); Object.assign(q.style, {left: '70px', top: '110px', background: '#fff'});
  const a = el('div', 'bub l', `<span class="who" style="background:var(--brand)">🦊 Cheeko</span><br>Sunlight bounces off the air, and blue bounces the most! 🌤️`, r);
  Object.assign(a.style, {left: '60px', top: '690px', background: '#FFE3B8', maxWidth: '600px'});
  CUES.bubbles.push(6.7, 8.15);
  S.talk.draw = t => { ph.style.transform = `scale(${lerp(1.03, 1.12, prog(t, 6, 10))})`; g.draw(t, popS(t, 6.2, .35));
    for (const [b, t0] of [[q, 6.7], [a, 8.15]]) { vis(b, t >= t0); b.style.transform = `scale(${popS(t, t0, .3)})`; b.style.transformOrigin = '20% 100%'; } };
}
// 4. imagine: say a wish, Cheeko paints it; the tiger pops out on the drop
{ const r = S.imagine.root; r.style.background = 'var(--purple)';
  const ray = el('div', 'ray', null, r); ray.style.left = '720px'; ray.style.top = '470px';
  const g = device(r, {W: 360, X: 560 - 360 * .47, Y: 150, screens: [[10, 'theme1_imagine_tiger_2_listening_transcript'], [10.9, 'theme1_imagine_tiger_3_painting'], [12, 'theme1_imagine_tiger_5_result']], presses: [10.1]});
  CUES.presses.push(10.1); CUES.flashes.push(12);
  const art = el('img', 'popart', null, r); art.src = fw('theme1_imagine_tiger_5_result');
  const conf = confetti(r, 70, 12);
  S.imagine.draw = t => { ray.style.transform = `rotate(${t * RAYSPD}deg)`; g.draw(t, popS(t, 10.05, .35));
    const p = eBack(prog(t, 12.05, 12.55)), [sx, sy] = g.scrPt;
    vis(art, t >= 12.05); const aw = lerp(160, 480, p), ah = aw * 240 / 296;
    Object.assign(art.style, {width: aw + 'px', height: ah + 'px', left: lerp(sx - 80, 1050 - 240, p) + 'px', top: lerp(sy - 65, 330, p) + 'px', transform: `rotate(${lerp(0, 5, p)}deg)`});
    conf(t, 12.05, 1050, 420); };
}
// 5. games: the dial turns through Jump, Paint and Piano; little ones playing
{ const r = S.games.root; r.style.background = 'var(--green)';
  const ray = el('div', 'ray', null, r); ray.style.left = '900px'; ray.style.top = '470px';
  const g = device(r, {W: 360, X: 930 - 360 * .47, Y: 150, screens: [[13.5, 'theme1_01_menu_3_games'], [14.15, 'theme1_04_games_menu_4_jump'], [14.85, 'theme1_04_games_menu_5_paint'], [15.55, 'theme1_04_games_menu_8_piano']],
    turns: [14.0, 14.7, 15.4]});
  CUES.presses.push(14.0, 14.7, 15.4);
  const pol = el('div', 'pol', `<img src="${IMG}shoot/DSC03042.jpg" style="object-position:50% 40%">`, r); Object.assign(pol.style, {left: '90px', top: '150px', width: '520px', height: '520px'});
  S.games.draw = t => { ray.style.transform = `rotate(${t * RAYSPD}deg)`; g.draw(t, popS(t, 13.55, .35));
    vis(pol, t >= 13.8); pol.style.transform = `rotate(-5deg) scale(${popS(t, 13.8, .35)})`; };
}
// 6. app: the parent sees every question, on an iPhone
{ const r = S.app.root; r.classList.add('dark');
  const glow = el('div', 'glow', null, r); glow.style.left = '470px'; glow.style.top = '540px';
  const P = makeIphone(r, 420, 260, 100);
  const shot = el('img', null, null, P.ps); shot.src = IMG + 'app-shots-ios/02_today_chats.png';
  const side = el('div', 'side', `You see 👀<br><span class="hl">everything.</span>`, r); Object.assign(side.style, {left: '790px', top: '340px', fontSize: '100px'});
  const sub = el('div', 'side', `Every question, in the parent app`, r); Object.assign(sub.style, {left: '792px', top: '600px', fontSize: '40px', fontFamily: 'var(--body)', fontWeight: 800, color: '#FFE3B8', maxWidth: '560px', lineHeight: 1.2});
  S.app.draw = t => { const u = eBack(prog(t, 16.6, 17.1)); P.ph.style.transform = `translateY(${(1 - u) * 900}px) rotate(${lerp(-8, -3, u)}deg)`;
    shot.style.transform = `translateY(${-lerp(0, P.SW * 2556 / 1179 - P.SH, eIO(prog(t, 17.3, 19.2)))}px)`;
    side.style.opacity = prog(t, 17.0, 17.3); side.style.transform = `translateY(${(1 - eOut(prog(t, 17.0, 17.4))) * 40}px)`;
    sub.style.opacity = prog(t, 17.6, 17.9); };
}
// 7. end: three colours, the three stamps, the line; then a wipe back into frame 0
{ const r = S.end.root; r.style.background = 'var(--tint)';
  const ray = el('div', 'ray', null, r); ray.style.left = '720px'; ray.style.top = '600px'; ray.style.opacity = .6;
  const cols = ['pink', 'yellow', 'white'].map((c, i) => device(r, {W: 250, X: 720 - 125 + (i - 1) * 290, Y: 330, color: c, screens: [[0, 'theme1_01_menu_1_talk']]}));
  const stamps = [['No video.', 20.6, -5, 70, 120], ['No feed.', 21.0, 3, 545, 96], ['No ads.', 21.4, -3, 985, 124]].map(([w, t0, rot, x, y]) => {
    const s = el('div', 'stamp', w, r); Object.assign(s.style, {left: x + 'px', top: y + 'px'}); s._t = t0; s._r = rot; CUES.stamps.push(t0); return s; });
  const line = el('div', 'big', `Less screen, more <span class="hl">childhood.</span>`, r); Object.assign(line.style, {top: '900px', fontSize: '86px'});
  S.end.draw = t => { ray.style.transform = `rotate(${t * RAYSPD}deg)`;
    cols.forEach((g, i) => { const p = eBack(prog(t, 19.7 + i * .15, 20.15 + i * .15)); g.draw(t); g.dev.style.transform = `translateY(${(1 - p) * 800}px) rotate(${(i - 1) * 6 * p}deg)`; });
    stamps.forEach(s => { vis(s, t >= s._t); const k = t >= s._t ? lerp(1.8, 1, eOut(prog(t, s._t, s._t + .16))) : 0; s.style.transform = `rotate(${s._r}deg) scale(${k})`; });
    line.style.opacity = prog(t, 22.0, 22.25); line.style.transform = `scale(${popS(t, 22.0, .3)})`; };
}

/* ---------- transitions + the loop ---------- */
const TR = .45, LOOP = 23.45;   // from 23.45 s the hello shot wipes back in, so frame 24.0 is frame 0
function place(s, t) {
  const r = s.root; r.style.clipPath = ''; r.style.transform = ''; r.style.zIndex = 0;
  if (!s.tr || t >= s.t + TR) return;
  const p = eOut(prog(t, s.t, s.t + TR)); r.style.zIndex = 2;
  if (s.tr === 'circle') r.style.clipPath = `circle(${p * 1000}px at 50% 42%)`;
  if (s.tr === 'lens') { r.style.clipPath = `circle(${p * 960}px at 50% 50%)`; r.style.transform = `scale(${lerp(1.25, 1, p)})`; }
  if (s.tr === 'whip') r.style.transform = `translateX(${(1 - p) * W}px)`;
  if (s.tr === 'card') r.style.transform = `translateY(${(1 - p) * H}px) rotate(${(1 - p) * 4}deg)`;
}
window.CUES = {...CUES, dur: DUR};
window.render = t => {
  for (const s of SHOTS) {
    const inLoop = s.key === 'hello' && t >= LOOP;
    const on = inLoop || (t >= s.t && t < s.end + TR);
    vis(s.root, on); if (!on) continue;
    const lt = inLoop ? 0 : t;          // the hello shot shows its frame 0 while it wipes back in
    s.draw(lt); place(s, t);
    if (inLoop) { s.root.style.zIndex = 3; s.root.style.clipPath = `circle(${eIO(prog(t, LOOP, DUR)) * 1000}px at 50% 42%)`; }
    if (s.key === 'hello' && !inLoop) s.root.style.zIndex = 0;
  }
  drawCaps(t);
};
window.ready = Promise.all([document.fonts.ready, ...[...document.images].map(i => i.decode().catch(() => {}))]).then(() => window.render(0));
</script>
