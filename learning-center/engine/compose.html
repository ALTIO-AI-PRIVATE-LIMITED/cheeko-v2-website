<!doctype html>
<html><head><meta charset="utf-8">
<!-- Learning Center quiz engine (V32-V53): one page draws every idea. compose.html?idea=<slug>&level=<n> loads ../<slug>/timeline_L<n>.js.
     window.render(t) draws the frame at time t; window.ready resolves after fonts and pictures load. Logical size 296x240 (Cheeko's screen),
     rendered at 2x. Glass safe area: corners curve in ~78 px from the sides and ~74 px from top and bottom, so the top and bottom strips
     only hold centred items. Modes: picture, swap, zoom, letter, count, shadow, sound, ask, riddle, odd, missing, pair. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@700;800;900&display=block">
<style>
:root{--ink:#10204a;--sun:#FFD84A;--disp:'Gabarito',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:296px;height:240px;overflow:hidden;background:#071a3a;font-family:var(--disp)}
.layer{position:absolute;inset:0;visibility:hidden}
canvas.bg,canvas.fx{position:absolute;left:0;top:0;width:296px;height:240px}
.head{position:absolute;left:0;right:0;top:5px;text-align:center;color:#fff;font-weight:900;font-size:16px;letter-spacing:.01em;
  -webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 2px 0 rgba(16,32,74,.45);white-space:nowrap}
.head span{color:var(--sun)}
.card{position:absolute;left:28px;top:30px;width:240px;height:180px;border-radius:17px;background:#fff;padding:4px;
  box-shadow:0 4px 0 rgba(16,32,74,.35),0 8px 18px rgba(0,0,0,.28);transform-origin:50% 55%}
.ph{position:relative;width:100%;height:100%;border-radius:13px;overflow:hidden;background:#8EC5F5}
.ph img.main,.ph img.alt{position:absolute;left:0;top:0;transform-origin:0 0}
.ph img.alt{opacity:0}
.flash{position:absolute;inset:4px;border-radius:13px;background:#fff;opacity:0}
.mystery{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,#5b8def,#2b4fb8);opacity:0}
.mystery b{font-weight:900;font-size:96px;color:#fff;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill}
.wave{position:absolute;border:3px solid rgba(255,255,255,.85);border-radius:50%;opacity:0}
.spk{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;opacity:0}
.bubble{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(255,255,255,.96);color:var(--ink);border-radius:12px;padding:5px 9px 6px;
  font-weight:800;font-size:12.5px;line-height:1.22;text-align:center;box-shadow:0 2px 0 rgba(16,32,74,.35);opacity:0;z-index:3}
.letter{position:absolute;left:30px;top:2px;font-weight:900;font-size:64px;line-height:1;color:#fff;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;z-index:3}
.ring{position:absolute;border:4px solid #fff;border-radius:50%;box-shadow:0 0 0 3px rgba(16,32,74,.6),inset 0 0 0 2px rgba(16,32,74,.4);opacity:0;z-index:3}
.grid4{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px;background:#fff}
.grid4 > div{position:relative;overflow:hidden;background:#8EC5F5}
.grid4 img{width:100%;height:100%;object-fit:cover;display:block}
.grid4 .cover{position:absolute;inset:0;background:radial-gradient(circle,#5b8def,#2b4fb8);display:flex;align-items:center;justify-content:center;opacity:0}
.grid4 .cover b{font-weight:900;font-size:40px;color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill}
.grid4 .hit{position:absolute;inset:3px;border:4px solid #22c55e;border-radius:8px;opacity:0;background:transparent}
.count{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:2px 4px;padding:8px;background:#8EC5F5}
.count img{display:block;transform:scale(0)}
.pair{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:2px;background:#8EC5F5}
.pair img{width:100px;height:100px;object-fit:contain;transform:scale(0)}
.pair b{font-weight:900;font-size:34px;color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;transform:scale(0)}
.badge{position:absolute;left:24px;top:26px;width:28px;height:28px;border-radius:50%;background:var(--sun);color:var(--ink);
  border:2.5px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:15px;box-shadow:0 2px 0 rgba(16,32,74,.4);z-index:4}
.cd{position:absolute;left:241px;top:24px;width:33px;height:33px;border-radius:50%;border:2.5px solid #fff;display:flex;
  align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:20px;box-shadow:0 2px 0 rgba(16,32,74,.45);
  -webkit-text-stroke:2px rgba(16,32,74,.55);paint-order:stroke fill;z-index:4}
.cd svg{width:19px;height:19px}
.bar{position:absolute;left:70px;top:217px;width:156px;height:13px;border-radius:7px;background:rgba(255,255,255,.3);border:2px solid var(--ink);overflow:hidden}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.knob{position:absolute;top:212px;width:21px;height:21px;margin-left:-10px;border-radius:50%;background:#fff;border:2px solid var(--ink);
  display:flex;align-items:center;justify-content:center;font-size:12px;line-height:1}
.pill{position:absolute;left:50%;top:207px;height:28px;padding:0 14px;border-radius:14px;background:#fff;color:var(--ink);
  display:flex;align-items:center;justify-content:center;white-space:nowrap;font-weight:900;font-size:20px;
  box-shadow:0 3px 0 rgba(16,32,74,.45),0 6px 14px rgba(0,0,0,.25);transform:translateX(-50%) scale(0);z-index:5}
.chk{position:absolute;left:48px;top:72px;width:200px;height:168px;transform-origin:50% 100%}
.chk img{position:absolute;inset:0;width:200px;height:168px;visibility:hidden}
.say{position:absolute;left:50%;top:14px;transform:translateX(-50%) scale(0);white-space:nowrap;background:#fff;color:var(--ink);
  font-weight:900;font-size:18px;padding:6px 14px 7px;border-radius:16px;box-shadow:0 3px 0 rgba(16,32,74,.4);z-index:3}
.say:after{content:'';position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fff}
.t1,.t2{position:absolute;left:0;right:0;text-align:center;font-weight:900;color:#fff;-webkit-text-stroke:3.5px var(--ink);paint-order:stroke fill;
  text-shadow:0 3px 0 rgba(16,32,74,.45);white-space:nowrap}
.t1{top:12px;font-size:21px}.t2{top:34px;font-size:34px;color:var(--sun)}
.lvl{position:absolute;left:50%;top:84px;height:30px;padding:0 16px;border-radius:15px;background:#ef4444;color:#fff;border:2.5px solid #fff;
  display:flex;align-items:center;font-weight:900;font-size:19px;white-space:nowrap;box-shadow:0 3px 0 rgba(16,32,74,.4);transform:translateX(-50%) scale(0)}
.lvl.done{top:56px;background:#22c55e}
.rule{position:absolute;left:136px;height:34px;white-space:nowrap;border-radius:17px;background:rgba(255,255,255,.95);color:var(--ink);
  display:flex;align-items:center;gap:6px;padding:0 12px 0 6px;font-weight:900;font-size:15px;box-shadow:0 3px 0 rgba(16,32,74,.4);transform:scale(0);transform-origin:20% 50%}
.rule i{font-style:normal;flex:none;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px}
.stamp{position:absolute;left:0;right:0;text-align:center;font-weight:900;color:var(--sun);-webkit-text-stroke:4px var(--ink);
  paint-order:stroke fill;text-shadow:0 3px 0 rgba(16,32,74,.5);transform:scale(0);white-space:nowrap}
.score{position:absolute;left:50%;top:60px;margin-left:-38px;width:76px;height:40px;border-radius:12px;background:var(--sun);color:var(--ink);
  border:2.5px solid #fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;box-shadow:0 3px 0 rgba(16,32,74,.4);transform:scale(0)}
.again{position:absolute;left:50%;top:60px;height:34px;padding:0 14px 0 8px;border-radius:17px;background:#22c55e;color:#fff;
  border:2.5px solid #fff;display:flex;align-items:center;gap:6px;font-weight:900;font-size:18px;white-space:nowrap;
  box-shadow:0 3px 0 rgba(16,32,74,.4);transform:translateX(-50%) scale(0)}
.again svg{width:22px;height:22px}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;z-index:10}
#TOPFX{z-index:5}
</style></head>
<body><div id="stage">
  <div class="layer" id="INTRO">
    <canvas class="bg"></canvas>
    <div class="chk"><img data-p="talk" src="../engine/assets/cheeko/talk.png"><img data-p="think" src="../engine/assets/cheeko/think.png"><img data-p="connect" src="../engine/assets/cheeko/connect.png"><img data-p="listen" src="../engine/assets/cheeko/listen.png"></div>
    <div class="say"></div>
    <div class="t1"></div><div class="t2"></div>
    <div class="lvl"></div>

    <div class="rule" style="top:84px"><i style="background:#f97316"></i><span></span></div>
    <div class="rule" style="top:128px"><i style="background:#22c55e">!</i><span></span></div>
    <div class="stamp" style="top:16px;font-size:34px">Let's go!</div>

  <div class="layer" id="RA"></div>
  <div class="layer" id="RB"></div>
  <div class="layer" id="OUTRO">
    <canvas class="bg"></canvas>
    <div class="chk"><img data-p="talk" src="../engine/assets/cheeko/talk.png"><img data-p="think" src="../engine/assets/cheeko/think.png"><img data-p="connect" src="../engine/assets/cheeko/connect.png"><img data-p="listen" src="../engine/assets/cheeko/listen.png"></div>
    <div class="stamp" style="top:14px;font-size:34px"></div>
    <div class="lvl done"></div>
    <div class="say"></div>
    <div class="score"></div>
    <div class="again"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 3.5v5h-5"/></svg><span></span></div>
    <canvas class="fx"></canvas>
  </div>
  <canvas class="fx" id="TOPFX"></canvas>
  <div id="fade"></div>
</div>
<script>const Q = new URLSearchParams(location.search); document.write('<script src="../' + Q.get('idea') + '/timeline_L' + (Q.get('level') || '1') + '.js"><\/script>');</script>
<script>
const TL = window.TL, TH = TL.theme, MODE = TL.mode, TR = .5, NSEC = TL.answer;
const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => 1 - Math.pow(1 - cl(x), 3);
const back = x => { x = cl(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const pop = (t, t0, d = .35) => t < t0 ? 0 : back((t - t0) / d);
const outk = (t, t0, d = .25) => 1 - ease((t - t0) / d);
function rnd(seed) { let s = seed * 9301 + 49297; return () => (s = (s * 9301 + 49297) % 233280) / 233280; }
function setupCanvas(c) { c.width = 592; c.height = 480; const x = c.getContext('2d'); x.setTransform(2, 0, 0, 2, 0, 0); return x; }

// ---------- backgrounds: one painter per idea, each with its own palette and moving pieces ----------
const PALS = TH.pals;           // [[centre, edge], ...] one per round, cycling
function grad(ctx, a, b) { const g = ctx.createRadialGradient(148, 104, 10, 148, 120, 210); g.addColorStop(0, a); g.addColorStop(1, b); ctx.fillStyle = g; ctx.fillRect(0, 0, 296, 240); }
function rays(ctx, t, a = .07) { ctx.save(); ctx.translate(148, 96); ctx.rotate(t * .12); ctx.fillStyle = `rgba(255,255,255,${a})`;
  for (let i = 0; i < 12; i++) { ctx.rotate(6.283 / 12); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-18, -260); ctx.lineTo(18, -260); ctx.closePath(); ctx.fill(); } ctx.restore(); }
function cloud(ctx, x, y, s) { ctx.beginPath(); for (const [dx, dy, rr] of [[0, 0, 9], [10, -5, 11], [22, 0, 9], [11, 4, 9]]) { ctx.moveTo(x + dx * s + rr * s, y + dy * s); ctx.arc(x + dx * s, y + dy * s, rr * s, 0, 6.283); } ctx.fill(); }
function star(ctx, x, y, r, rot = 0) { ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = rot + i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * .45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } ctx.closePath(); }
function heart(ctx, x, y, s) { ctx.beginPath(); ctx.moveTo(x, y + s * .3); ctx.bezierCurveTo(x, y, x - s * .5, y, x - s * .5, y + s * .3); ctx.bezierCurveTo(x - s * .5, y + s * .6, x, y + s * .8, x, y + s); ctx.bezierCurveTo(x, y + s * .8, x + s * .5, y + s * .6, x + s * .5, y + s * .3); ctx.bezierCurveTo(x + s * .5, y, x, y, x, y + s * .3); ctx.fill(); }
function hills(ctx, t, c1, c2) { for (const [yb, amp, col, ph] of [[200, 10, c1, 0], [214, 8, c2, 2]]) { ctx.beginPath(); ctx.moveTo(0, 240);
  for (let x = 0; x <= 296; x += 4) ctx.lineTo(x, yb + amp * Math.sin(x / 40 + ph)); ctx.lineTo(296, 240); ctx.closePath(); ctx.fillStyle = col; ctx.fill(); } }
function band(ctx, col) { ctx.fillStyle = col; ctx.fillRect(0, 212, 296, 28); }
const P = {};
const R7 = rnd(7), FLOAT = Array.from({ length: 16 }, () => ({ x: R7() * 296, y: R7() * 240, s: .6 + R7() * .9, v: 6 + R7() * 12, o: R7() * 400, w: R7() * 6.28 }));
P.farm = (c, p, t) => { grad(c, p[0], p[1]); rays(c, t, .08); c.fillStyle = 'rgba(255,255,255,.35)'; for (const f of FLOAT.slice(0, 6)) cloud(c, 330 - ((t * f.v + f.o) % 400), 8 + f.y * .5, f.s);
  hills(c, t, 'rgba(60,170,70,.85)', 'rgba(40,140,55,.95)'); c.strokeStyle = 'rgba(120,80,40,.7)'; c.lineWidth = 2; for (let x = 6; x < 296; x += 22) { c.beginPath(); c.moveTo(x, 214); c.lineTo(x, 232); c.stroke(); } c.beginPath(); c.moveTo(0, 220); c.lineTo(296, 220); c.stroke(); };
P.garden = (c, p, t) => { grad(c, p[0], p[1]); for (const [i, f] of FLOAT.entries()) { c.fillStyle = ['rgba(255,99,99,.35)', 'rgba(255,200,60,.35)', 'rgba(120,220,90,.35)', 'rgba(255,150,40,.35)'][i % 4];
  const y = (f.y + t * f.v * .6) % 260 - 10; c.beginPath(); c.arc(f.x + 6 * Math.sin(t + f.w), y, 5 + f.s * 6, 0, 6.283); c.fill(); } band(c, 'rgba(70,150,60,.65)'); };
P.rainbow = (c, p, t) => { grad(c, p[0], p[1]); const cols = ['#ff5a5a', '#ff9f3c', '#ffd93c', '#5cd65c', '#4aa3ff', '#7a5cff', '#c55cff'];
  c.lineWidth = 7; cols.forEach((col, i) => { c.strokeStyle = col + '88'; c.beginPath(); c.arc(148, 250, 210 - i * 8 + 3 * Math.sin(t * 1.5), Math.PI, 0); c.stroke(); });
  c.fillStyle = 'rgba(255,255,255,.75)'; cloud(c, 18 + 4 * Math.sin(t), 200, 1.4); cloud(c, 244 - 4 * Math.sin(t), 200, 1.4); };
P.playroom = (c, p, t) => { grad(c, p[0], p[1]); for (const [i, f] of FLOAT.entries()) { c.save(); c.translate(f.x, (f.y + t * f.v) % 260 - 10); c.rotate(t * .8 + f.w);
  c.fillStyle = ['#ffd84a99', '#ff7fa899', '#7cc8ff99', '#8be08b99'][i % 4]; c.fillRect(-4 * f.s, -4 * f.s, 8 * f.s + 4, 8 * f.s + 4); c.restore(); } band(c, 'rgba(255,255,255,.28)'); };
P.meadow = (c, p, t) => { grad(c, p[0], p[1]); rays(c, t, .06); hills(c, t, 'rgba(110,200,90,.9)', 'rgba(80,175,70,.95)');
  for (const [i, f] of FLOAT.slice(0, 10).entries()) { c.fillStyle = ['#ff7fa8', '#ffd84a', '#ffffff', '#c58bff'][i % 4]; c.beginPath(); c.arc(f.x, 222 + (i % 3) * 5, 3, 0, 6.283); c.fill(); }
  for (const f of FLOAT.slice(10, 13)) { const x = (f.x + t * 14) % 316 - 10, y = 40 + f.y * .4 + 8 * Math.sin(t * 3 + f.w); c.fillStyle = '#fff6'; c.beginPath(); c.ellipse(x - 3, y, 4, 3 * Math.abs(Math.sin(t * 9 + f.w)) + 1, 0, 0, 6.283); c.ellipse(x + 3, y, 4, 3 * Math.abs(Math.sin(t * 9 + f.w)) + 1, 0, 0, 6.283); c.fill(); } };
P.chalk = (c, p, t) => { c.fillStyle = p[1]; c.fillRect(0, 0, 296, 240); grad(c, p[0], p[1]); c.font = '900 22px Gabarito'; c.textAlign = 'center';
  const L = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'; for (const [i, f] of FLOAT.entries()) { c.fillStyle = 'rgba(255,255,255,.16)'; c.save(); c.translate(f.x, (f.y - t * f.v * .7 + 400) % 260 - 10); c.rotate(.3 * Math.sin(t + f.w)); c.fillText(L[(i * 7) % 26], 0, 0); c.restore(); }
  c.fillStyle = 'rgba(120,80,40,.85)'; c.fillRect(0, 230, 296, 10); };
P.counting = (c, p, t) => { grad(c, p[0], p[1]); c.font = '900 20px Gabarito'; c.textAlign = 'center';
  for (const [i, f] of FLOAT.entries()) { c.fillStyle = 'rgba(255,255,255,.18)'; c.fillText(String(1 + i % 10), f.x, (f.y + t * f.v) % 260); }
  c.fillStyle = 'rgba(255,255,255,.12)'; for (let x = 8; x < 296; x += 16) for (let y = 8; y < 240; y += 16) { c.beginPath(); c.arc(x, y, 1.2, 0, 6.283); c.fill(); } band(c, 'rgba(16,32,74,.25)'); };
P.night = (c, p, t) => { grad(c, p[0], p[1]); for (const [i, f] of FLOAT.entries()) { c.fillStyle = `rgba(255,255,240,${.4 + .4 * Math.sin(t * 2 + f.w)})`; star(c, f.x, f.y * .9, 1.5 + f.s * 1.5, f.w); c.fill(); }
  const sx = 148 + 70 * Math.sin(t * .6); const g = c.createRadialGradient(sx, 0, 5, sx, 120, 160); g.addColorStop(0, 'rgba(255,255,220,.22)'); g.addColorStop(1, 'rgba(255,255,220,0)');
  c.fillStyle = g; c.beginPath(); c.moveTo(sx - 12, -5); c.lineTo(sx + 12, -5); c.lineTo(sx + 110, 250); c.lineTo(sx - 110, 250); c.closePath(); c.fill(); band(c, 'rgba(0,0,0,.3)'); };
P.pastel = (c, p, t) => { grad(c, p[0], p[1]); c.fillStyle = 'rgba(255,255,255,.4)'; for (const f of FLOAT.slice(0, 7)) cloud(c, 330 - ((t * f.v * .7 + f.o) % 400), f.y * .9, f.s * 1.2);
  c.fillStyle = 'rgba(255,120,160,.3)'; for (const f of FLOAT.slice(7, 13)) heart(c, f.x, (f.y - t * f.v + 400) % 260 - 10, 8 + f.s * 6); band(c, 'rgba(255,255,255,.25)'); };
P.shapes = (c, p, t) => { grad(c, p[0], p[1]); c.lineWidth = 2.5; for (const [i, f] of FLOAT.entries()) { c.save(); c.translate(f.x, (f.y + t * f.v * .5) % 260); c.rotate(t * .5 + f.w); c.strokeStyle = 'rgba(255,255,255,.3)'; const r = 6 + f.s * 6; c.beginPath();
  if (i % 4 === 0) c.arc(0, 0, r, 0, 6.283); else if (i % 4 === 1) c.rect(-r, -r, 2 * r, 2 * r); else if (i % 4 === 2) { c.moveTo(0, -r); c.lineTo(r, r); c.lineTo(-r, r); c.closePath(); } else star(c, 0, 0, r, 0); c.stroke(); c.restore(); } band(c, 'rgba(16,32,74,.22)'); };
P.city = (c, p, t) => { grad(c, p[0], p[1]); rays(c, t, .05); const R = rnd(3); c.fillStyle = 'rgba(16,32,74,.35)'; let x = -5;
  while (x < 300) { const w = 14 + R() * 18, h = 30 + R() * 70; c.fillRect(x, 212 - h, w, h); c.fillStyle = 'rgba(255,230,120,.5)'; for (let wy = 212 - h + 6; wy < 205; wy += 9) for (let wx = x + 3; wx < x + w - 4; wx += 6) if (R() > .5) c.fillRect(wx, wy, 2.5, 3.5); c.fillStyle = 'rgba(16,32,74,.35)'; x += w + 2; }
  band(c, 'rgba(30,34,48,.55)'); c.fillStyle = 'rgba(255,216,74,.55)'; for (let x2 = -((t * 40) % 30); x2 < 296; x2 += 30) c.fillRect(x2, 225, 16, 2.5); };

  R.pill.style.transform = `translateX(-50%) scale(${pk * (1 + say)})`;
  R.fx.clearRect(0, 0, 296, 240); fxBurst(R.fx, 148, 220, (u - T.reveal) / .9, r.k * 13 + idx, 14, 80); fxBurst(R.fx, 257, 40, (u - T.reveal) / .6, r.k * 7 + idx, 8, 30);
}

// ---------- intro and outro ----------
function poseOf(id, p) { for (const im of $$('.chk img', L[id].el)) im.style.visibility = im.dataset.p === p ? 'visible' : 'hidden'; }
function drawIntro(t) {
  const I = L.INTRO, el = I.el, B = TL.intro;
  drawBg(I.bg, t, 0);
  const chk = $('.chk', el), say = $('.say', el);
  if (!$('.t1', el).textContent) { $('.t1', el).textContent = TL.t1; $('.t2', el).textContent = TL.t2; $('.lvl', el).textContent = TL.nLevels > 1 ? 'Level ' + TL.level : TL.n + ' rounds';
    const rl = $$('.rule', el); TL.chips.forEach((c, i) => { $('span', rl[i]).textContent = c[1]; $('i', rl[i]).textContent = c[0]; });
    rl.forEach((e, i) => {     // keep each chip inside the rounded glass: shrink the text, then slide left if still too wide
      const lim = [250, 282, 276][i]; let fs = 15;
      while (136 + e.offsetWidth > lim && fs > 11) { fs -= .5; e.style.fontSize = fs + 'px'; }
      if (136 + e.offsetWidth > lim) e.style.left = (lim - e.offsetWidth) + 'px';
    }); }
  poseOf('INTRO', t < B.rules ? 'talk' : t < B.go ? 'think' : 'connect');
  const up = pop(t, .1, .55); let dx = 0, dy = (1 - up) * 170, sc = 1;
  if (t >= B.title) { const k = ease((t - B.title) / .4); dy += 34 * k; sc = 1 - .16 * k; }
  if (t >= B.rules) { const k = ease((t - B.rules) / .4); dx = -66 * k; dy += 2 * k; sc -= .08 * k; }
  if (t >= B.go) { const k = ease((t - B.go) / .4); dx *= 1 - k; dy -= 8 * k; sc += .12 * k; }
  chk.style.transform = `translate(${dx}px,${dy + 2 * Math.sin(t * 5)}px) scale(${sc})`;
  let txt = '', sk = 0;
  if (t >= B.hi && t < B.title) { txt = "Hi! I'm Cheeko!"; sk = pop(t, B.hi, .35) * (t > B.title - .2 ? outk(t, B.title - .2, .2) : 1); }
  if (t >= B.go && t < B.go + .85) { txt = 'Ready?'; sk = pop(t, B.go, .3) * (t > B.go + .65 ? outk(t, B.go + .65, .2) : 1); }
  if (say.textContent !== txt) say.textContent = txt; say.style.transform = `translateX(-50%) scale(${sk})`;
  const tk = t < B.rules ? 1 : outk(t, B.rules, .3);
  $('.t1', el).style.transform = `translateY(${(1 - ease((t - B.title) / .35)) * -60}px) scale(${tk})`;
  $('.t2', el).style.transform = `scale(${pop(t, B.title + .55, .45) * tk})`;
  const lv = $('.lvl', el); lv.style.transform = `translateX(-50%) scale(${pop(t, B.level, .35) * (t < B.rules ? 1 : outk(t, B.rules, .25))}) rotate(${-3 * pop(t, B.level, .35)}deg)`;
  const rl = $$('.rule', el), rd = (B.go - B.rules), at = [.05, .38, .62];
  rl.forEach((e, i) => e.style.transform = `scale(${pop(t, B.rules + at[i] * rd, .35) * (t < B.go ? 1 : outk(t, B.go, .25))})`);
  const gk = pop(t, B.go + .7, .35); $('.stamp', el).style.transform = `scale(${gk}) rotate(${-4 * gk}deg)`;
  I.fx.clearRect(0, 0, 296, 240); fxBurst(I.fx, 148, 40, (t - B.go - .7) / .9, 3, 16, 110); fxBurst(I.fx, 148, 60, (t - B.title - .55) / .9, 5, 14, 100);
}
function drawOutro(t) {
  const O = L.OUTRO, el = O.el, B = TL.outro, t0 = TL.outroStart;
  drawBg(O.bg, t, 1);
  if (!$('.stamp', el).textContent) { $('.stamp', el).textContent = TL.outroText[0]; $('.lvl', el).textContent = TL.outroText[1]; $('.again span', el).textContent = TL.outroText[2]; $('.score', el).textContent = '? / ' + TL.n; }
  poseOf('OUTRO', t < B.bye ? (t < B.howmany ? 'connect' : 'talk') : 'listen');
  const chk = $('.chk', el), up = pop(t, t0 + .15, .5);
  chk.style.transform = `translate(0,${(1 - up) * 170 + 14 + 2 * Math.sin(t * 5)}px) scale(.9)`;
  const sk = pop(t, B.done, .35) * (t < B.howmany - .15 ? 1 : outk(t, B.howmany - .15, .2));
  $('.stamp', el).style.transform = `scale(${sk}) rotate(${-4 * sk}deg)`;
  $('.lvl', el).style.transform = `translateX(-50%) scale(${pop(t, B.done + .45, .35) * (t < B.howmany - .15 ? 1 : outk(t, B.howmany - .15, .2))})`;
  const say = $('.say', el); let txt = '', k = 0;
  if (t >= B.howmany && t < B.next - .1) { txt = 'How many did you get?'; k = pop(t, B.howmany, .35) * (t < B.next - .3 ? 1 : outk(t, B.next - .3, .2)); }
  if (t >= B.bye) { txt = 'Bye bye!'; k = pop(t, B.bye, .35); }
  if (say.textContent !== txt) say.textContent = txt; say.style.transform = `translateX(-50%) scale(${k})`;
  $('.score', el).style.transform = `scale(${pop(t, B.howmany + .5, .35) * (t < B.next - .3 ? 1 : outk(t, B.next - .3, .2))})`;
  $('.again', el).style.transform = `translateX(-50%) scale(${pop(t, B.next + .1, .35) * (t < B.bye - .15 ? 1 : outk(t, B.bye - .15, .2))}) rotate(${-3 * Math.sin(t * 6) * (t > B.next + .4 ? 1 : 0)}deg)`;
  O.fx.clearRect(0, 0, 296, 240); fxBurst(O.fx, 148, 36, (t - B.done) / 1.1, 11, 20, 130); fxBurst(O.fx, 148, 76, (t - B.next - .1) / .9, 17, 12, 90);
}

// ---------- transitions between scenes ----------
function trans(layerEl, k, t) {
  if (k >= 1) { layerEl.style.clipPath = ''; layerEl.style.transform = ''; layerEl.style.opacity = ''; return; }
  const kind = TH.trans || 'wave', e = ease(k);
  TOP.lineWidth = 4; TOP.strokeStyle = 'rgba(255,255,255,.9)';
  if (kind === 'wave') {
    const x0 = 330 - k * 380, pts = []; for (let y = -10; y <= 250; y += 10) pts.push(`${x0 + 12 * Math.sin(y / 20 + t * 7)}px ${y}px`);
    layerEl.style.clipPath = `polygon(${pts.join(',')},400px 250px,400px -10px)`;
    TOP.beginPath(); for (let y = -10; y <= 250; y += 5) { const x = x0 + 12 * Math.sin(y / 20 + t * 7); y === -10 ? TOP.moveTo(x, y) : TOP.lineTo(x, y); } TOP.stroke();
  } else if (kind === 'iris') { const r = e * 200; layerEl.style.clipPath = `circle(${r}px at 148px 120px)`; TOP.beginPath(); TOP.arc(148, 120, r, 0, 6.283); TOP.stroke(); }
  else if (kind === 'slide') { layerEl.style.transform = `translateX(${(1 - e) * 296}px)`; }
  else if (kind === 'blinds') { const w = 296 / 8, parts = []; for (let i = 0; i < 8; i++) { const ww = w * cl(k * 1.6 - i * .08); parts.push(`${i * w}px 0,${i * w + ww}px 0,${i * w + ww}px 240px,${i * w}px 240px,${i * w}px 0`); }
    layerEl.style.clipPath = `polygon(evenodd,${parts.join(',')})`; }
  else if (kind === 'diamond') { const r = e * 280; layerEl.style.clipPath = `polygon(148px ${120 - r}px,${148 + r}px 120px,148px ${120 + r}px,${148 - r}px 120px)`;
    TOP.beginPath(); TOP.moveTo(148, 120 - r); TOP.lineTo(148 + r, 120); TOP.lineTo(148, 120 + r); TOP.lineTo(148 - r, 120); TOP.closePath(); TOP.stroke(); }
  else if (kind === 'curtain') { const w = e * 148; layerEl.style.clipPath = `polygon(${148 - w}px 0,${148 + w}px 0,${148 + w}px 240px,${148 - w}px 240px)`; }
  else if (kind === 'zoom') { layerEl.style.transform = `scale(${.3 + .7 * e}) rotate(${(1 - e) * 20}deg)`; layerEl.style.opacity = cl(k * 2); }
}
function show(id, on, z) { const e = L[id].el; e.style.visibility = on ? 'visible' : 'hidden'; if (on) e.style.zIndex = z; }
window.render = t => {
  TOP.clearRect(0, 0, 296, 240);
  const RS = TL.rounds, T0 = RS[0].start, O = TL.outroStart, n = RS.length;
  for (const id of ['INTRO', 'RA', 'RB', 'OUTRO']) { const e = L[id].el; e.style.visibility = 'hidden'; e.style.clipPath = ''; e.style.transform = ''; e.style.opacity = ''; }
  if (t < T0) { show('INTRO', 1, 1); drawIntro(t); }
  else if (t < O) {
    let i = 0; while (i < n - 1 && t >= RS[i + 1].start) i++;
    const r = RS[i], u = t - r.start, cur = i % 2 ? 'RB' : 'RA';
    show(cur, 1, 2); drawRound(cur, r, u, t, i);
    if (u < TR) {
      if (i === 0) { show('INTRO', 1, 1); drawIntro(t); }
      else { const prev = i % 2 ? 'RA' : 'RB', pr = RS[i - 1]; show(prev, 1, 1); drawRound(prev, pr, t - pr.start, t, i - 1); }
      trans(L[cur].el, u / TR, t);
    }
  } else {
    const u = t - O; show('OUTRO', 1, 2); drawOutro(t);
    if (u < TR) { const last = (n - 1) % 2 ? 'RB' : 'RA', lr = RS[n - 1]; show(last, 1, 1); drawRound(last, lr, t - lr.start, t, n - 1); trans(L.OUTRO.el, u / TR, t); }
  }
  $('#fade').style.opacity = cl((t - (TL.dur - .7)) / .7);
};
window.ready = (async () => {
  const keys = new Set(); for (const r of TL.rounds) { for (const k of [r.img, r.img2, ...(r.grid || []), ...(Array.isArray(r.cut) ? r.cut : r.cut ? [r.cut] : [])]) if (k) keys.add(k); }
  await Promise.all([...keys].map(k => new Promise(res => { const im = new Image(); im.onload = res; im.onerror = () => { console.error('missing picture ' + k); res(); }; im.src = TL.paths[k]; IMG[k] = im; })));
  await Promise.all($$('img').map(im => im.decode().catch(() => {})));
  await document.fonts.ready; await document.fonts.load('900 20px Gabarito');
  window.render(0);
})();
</script></body></html>
