<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@700;800;900&family=Baloo+2:wght@600;700;800&display=block">
<style>
  /* One template, three layouts: ?k=square (album/library cover), ?k=wide (YouTube 16:9), ?k=device (Cheeko 296x240 screen) */
  html, body { margin: 0; background: #0b1230; }
  .c { position: relative; overflow: hidden; }
  .art { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(8,14,44,.82) 0%, rgba(8,14,44,.45) 26%, rgba(8,14,44,0) 44%, rgba(8,14,44,0) 78%, rgba(8,14,44,.55) 100%); }
  .t { position: absolute; left: 0; right: 0; text-align: center; color: #FFE9A8; text-shadow: 0 0 18px rgba(255,214,120,.55), 0 3px 0 rgba(10,18,52,.9); }
  .en .title { font-family: 'Gabarito', sans-serif; font-weight: 900; letter-spacing: .5px; }
  .hi .title { font-family: 'Baloo 2', sans-serif; font-weight: 800; }
  .sub { position: absolute; left: 0; right: 0; text-align: center; color: #fff; opacity: .92; font-weight: 700; letter-spacing: 2px; }
  .en .sub { font-family: 'Gabarito', sans-serif; text-transform: uppercase; }
  .hi .sub { font-family: 'Baloo 2', sans-serif; letter-spacing: 0; }
  .num { position: absolute; border-radius: 50%; background: #FFD84A; color: #10204a; font-family: 'Gabarito', sans-serif; font-weight: 900;
         display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 4px rgba(255,255,255,.85), 0 6px 16px rgba(0,0,0,.35); }
  /* square 750 css px -> 1500 px */
  .square { width: 750px; height: 750px; }
  .square .title { top: 46px; font-size: 64px; line-height: 1.02; padding: 0 40px; }
  .square .sub { top: 18px; font-size: 19px; }
  .square .num { width: 56px; height: 56px; font-size: 30px; right: 26px; bottom: 26px; }
  .square.left .title { text-align: left; padding: 0 330px 0 38px; top: 52px; }
  .square.left .sub { text-align: left; left: 40px; }
  /* wide 640x360 css px -> 1280x720 */
  .wide { width: 640px; height: 360px; }
  .wide .blur { position: absolute; inset: -30px; background-size: cover; background-position: center; filter: blur(22px) brightness(.55); }
  .wide .sq { position: absolute; right: 22px; top: 22px; width: 316px; height: 316px; border-radius: 22px; background-size: cover; background-position: center;
              box-shadow: 0 10px 30px rgba(0,0,0,.45), 0 0 0 3px rgba(255,255,255,.18); }
  .wide .t { left: 26px; right: 352px; text-align: left; }
  .wide .title { top: 112px; font-size: 44px; line-height: 1.05; }
  .wide .sub { left: 28px; right: 352px; text-align: left; top: 70px; font-size: 15px; }
  .wide .num { width: 44px; height: 44px; font-size: 24px; left: 28px; bottom: 30px; }
  .wide .moon { position: absolute; left: 84px; bottom: 36px; color: #fff; opacity: .85; font: 700 15px 'Gabarito', sans-serif; letter-spacing: 1px; }
  .hi.wide .moon { font-family: 'Baloo 2', sans-serif; letter-spacing: 0; font-size: 16px; }
  /* device 296x240 */
  .device { width: 296px; height: 240px; }
  .device .shade { background: radial-gradient(ellipse at 50% 55%, rgba(0,0,0,0) 55%, rgba(6,10,34,.55) 100%); }
</style></head><body>
<div id="c" class="c"></div>
<script>
const q = new URLSearchParams(location.search), k = q.get('k'), lang = q.get('lang'), art = q.get('art');
const c = document.getElementById('c'); c.className = `c ${k} ${lang} ${q.get('al') || ''}`;
const title = q.get('title'), sub = q.get('sub'), num = q.get('num'), foot = q.get('foot') || '';
if (k === 'square') c.innerHTML = `<div class="art" style="background-image:url('${art}')"></div><div class="shade"></div>
  <div class="sub">${sub}</div><div class="t title">${title}</div>${num ? `<div class="num">${num}</div>` : ''}`;
if (k === 'wide') c.innerHTML = `<div class="blur" style="background-image:url('${art}')"></div><div class="sq" style="background-image:url('${art}')"></div>
  <div class="sub">${sub}</div><div class="t title">${title}</div>${num ? `<div class="num">${num}</div><div class="moon">${foot}</div>` : `<div class="moon" style="left:28px">${foot}</div>`}`;
if (k === 'device') c.innerHTML = `<div class="art" style="background-image:url('${art}');background-position:${q.get('pos') || '50% 60%'}"></div><div class="shade"></div>`;
window.ready = document.fonts.ready.then(() => new Promise(r => setTimeout(r, 300)));
</script></body></html>
