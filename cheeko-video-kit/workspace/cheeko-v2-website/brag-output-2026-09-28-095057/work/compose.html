<div class="layer" id="proof" style="background:var(--tint)">
  <div class="abs center disp" id="pr-h">Insert. Play.<br><span style="color:var(--brand)">Repeat.</span></div>
  <div class="pol" id="p1" style="left:60px;top:560px"><img src="../../assets/img/live/hero-kid-slot.jpg" style="width:560px;height:420px"></div>
  <div class="pol" id="p2" style="left:560px;top:760px"><img src="../../assets/img/live/kid-dance.jpg" style="width:440px;height:440px"></div>
  <div class="pol" id="p3" style="left:120px;top:1030px"><img src="../../assets/img/live/s2-child-holding.jpg" style="width:440px;height:440px"></div>
  <div class="abs center" id="pr-cap">Real device. Real kids.</div>
</div>

<!-- OUTRO -->
<div class="layer" id="out" style="background:var(--tint)">
  <img class="abs" id="o-logo" src="../../assets/img/logo.png">
  <img class="abs oc" id="o-c1" src="../../assets/img/cards-shipping/07-clever-little-tales.jpg">
  <img class="abs oc" id="o-c2" src="../../assets/img/cards-shipping/08-ravi-and-nila.jpg">
  <img class="abs oc" id="o-c3" src="../../assets/img/cards-shipping/01-tales-of-kindness.jpg">
  <img class="abs" id="o-dev" src="../../assets/img/device_current.png">
  <div class="abs center disp" id="o-h">Less screen,<br>more <span class="hl">childhood.<b id="o-hl"></b></span></div>
  <div class="abs center disp" id="o-price">₹5,999</div>
  <div class="abs center" id="o-sub">Device + 10 cards · Free delivery across India</div>
  <div class="abs" id="o-pill">cheekoai.in</div>
  <div id="o-conf"></div>
</div>

</div>
<script>
const $ = id => document.getElementById(id);
const clamp = (x,a=0,b=1) => Math.min(b, Math.max(a, x));
const prog = (t,a,b) => clamp((t-a)/(b-a));
const eOut = x => 1 - Math.pow(1-x, 3);
const eIn = x => x*x;
const eBack = x => { const c=2.2, d=c+1; return 1 + d*Math.pow(x-1,3) + c*Math.pow(x-1,2); };
const lerp = (a,b,x) => a + (b-a)*x;
const vis = (el, on) => el.style.visibility = on ? 'visible' : 'hidden';
function pop(el, t, t0, dur=.35, base='') {
  const p = prog(t, t0, t0+dur);
  el.style.opacity = clamp(p*3);
  el.style.transform = `${base} scale(${lerp(.3, 1, eBack(p))})`;
}
function rise(el, t, t0, dur=.3, dy=60, base='') {
  const p = eOut(prog(t, t0, t0+dur));
  el.style.opacity = p; el.style.transform = `${base} translateY(${(1-p)*dy}px)`;
}
function out(el, t, t0, dur=.2) { el.style.opacity = +el.style.opacity * (1 - prog(t, t0, t0+dur)); }
function seeded(s){ return () => (s = (s*16807) % 2147483647) / 2147483647; }
const COLORS = ['#F0521D','#FFC81A','#6C3DFF','#2F6B4F','#FFA9C9','#FFFFFF'];
function makeConf(host, n, seed) {
  const r = seeded(seed); const parts = [];
  for (let i=0;i<n;i++) {
    const d = document.createElement('div'); d.className='conf';
    d.style.background = COLORS[i % COLORS.length]; host.appendChild(d);
    const a = -Math.PI/2 + (r()-.5)*2.2, v = 900 + r()*1400;
    parts.push({ d, vx: Math.cos(a)*v, vy: Math.sin(a)*v, spin: (r()-.5)*1400, w: .6 + r()*.8 });
  }
  return parts;
}
function drawConf(parts, t, t0, x0, y0) {
  const dt = t - t0;
  for (const p of parts) {
    if (dt < 0 || dt > 2.6) { p.d.style.opacity = 0; continue; }
    const drag = (1 - Math.exp(-dt*1.6)) / 1.6;
    p.d.style.opacity = clamp((2.6-dt)/.5);
    p.d.style.transform = `translate(${x0 + p.vx*drag}px,${y0 + p.vy*drag + 450*dt*dt}px) rotate(${p.spin*dt}deg) scale(${p.w}, ${Math.cos(dt*9+p.spin)})`;
  }
}
const devConf = makeConf($('c-conf'), 50, 5);
const outConf = makeConf($('o-conf'), 110, 29);

// 120 BPM, beats every .5s. Rounds: card lands on 6.0, 8.5, 11.0
const ROUNDS = [['c1','w1','r1',5.5],['c2','w2','r2',8.0],['c3','w3','r3',10.5]];

window.render = function(t) {
  /* ---- hook 0-3.0 ---- */
  vis($('hook'), t < 3.4);
  {
    const p = eOut(prog(t, 0, .4));
    $('h-photo').style.opacity = p;
    $('h-photo').style.transform = `scale(${lerp(.92, 1, p)})`;
    $('h-photo').querySelector('img').style.transform = `scale(${lerp(1.0, 1.08, prog(t, 0, 3))})`;
    pop($('h-l1'), t, .25, .35);
    // the ✕ stamp slams onto the phone
    const x = prog(t, 1.3, 1.5);
    $('h-x').style.opacity = clamp(x*3);
    $('h-x').style.transform = `scale(${lerp(2.4, 1, eOut(x))}) rotate(${lerp(-30, -8, x)}deg)`;
    pop($('h-l2'), t, 1.4, .3);
    const shake = t > 1.5 && t < 1.8 ? Math.sin(t*90) * 10 * (1 - prog(t, 1.5, 1.8)) : 0;
    $('h-photo').style.transform += ` translateX(${shake}px)`;
  }

  /* ---- sun disc wipes in at 3.0 ---- */
  {
    const p = eOut(prog(t, 2.85, 3.2));
    const el = $('d-sun'); vis(el, t >= 2.85 && t < 13.4);
    el.style.width = el.style.height = (p * 2400) + 'px';
  }

  /* ---- device beats 3.0-13.0 ---- */
  vis($('devbeat'), t >= 3.0 && t < 13.4);
  {
    // device pops in, squashes on each landing
    pop($('devwrap'), t, 3.05, .4);
    let sq = 1;
    for (const [, , , r0] of ROUNDS) { const q = prog(t, r0+.5, r0+.75); sq += Math.sin(q*Math.PI) * .06; }
    if (t > 3.45) $('devwrap').style.transform = `scale(${2-sq}, ${sq})`;
    // "Instead / Hand them Cheeko."
    pop($('hand-k'), t, 3.3, .3, 'translateX(-50%)');
    pop($('hand-h'), t, 3.5, .35);
    out($('hand-k'), t, 5.35); out($('hand-h'), t, 5.35);
    // a stack of cards fans out behind the device, then gets tucked away
    ['fan1','fan2','fan3','fan4'].forEach((id, i) => {
      const f = eBack(prog(t, 3.7 + i*.07, 4.15 + i*.07));
      const back = eIn(prog(t, 5.15, 5.45));
      const ang = [-30, -12, 12, 30][i], dx = [-330, -130, 130, 330][i];
      const el = $(id);
      el.style.opacity = clamp(prog(t, 3.7 + i*.07, 3.8 + i*.07)) * (1 - back);
      el.style.transform = `translateX(${dx*f*(1-back)}px) rotate(${ang*f*(1-back)}deg) translateY(${(1-clamp(f))*300 + back*200}px)`;
    });
    // "Insert a card..."
    pop($('ins'), t, 5.45, .3);
    out($('ins'), t, 12.9);
    ROUNDS.forEach(([c, w, r, r0], i) => {
      const card = $(c), world = $(w), res = $(r);
      const next = ROUNDS[i+1] ? ROUNDS[i+1][3] : 13.0;
      // drop into the slot, landing on the beat at r0+.5
      const d = prog(t, r0 + .05, r0 + .5);
      const bounce = t > r0+.5 ? Math.sin(prog(t, r0+.5, r0+.8)*Math.PI) * -36 * (1-prog(t, r0+.5, r0+.8)) : 0;
      let y = lerp(-520, 244, eIn(d)) + bounce, rot = lerp(12, 0, d), op = t >= r0 + .05 ? 1 : 0;
      // pop back out and fly off when the next card comes
      const e = prog(t, next - .05, next + .35);
      if (e > 0) { y -= eOut(e) * 900; rot += e * (i % 2 ? -40 : 40); card.style.left = (311 + e*(i % 2 ? -500 : 500)) + 'px'; }
      card.style.top = y + 'px'; card.style.opacity = op; card.style.transform = `rotate(${rot}deg)`;
      // the screen switches from the Talk menu to this card's world as it lands
      const sc = $('s' + (i+1)), sp = eOut(prog(t, r0 + .5, r0 + .8));
      vis(sc, t >= r0 + .5);
      sc.style.clipPath = `circle(${sp * 80}% at 50% 50%)`;
      sc.style.transform = `scale(${lerp(1.3, 1.0, sp) + .05*prog(t, r0+.8, r0+3)})`;
      sc.style.filter = `brightness(${1 + .6*(1 - prog(t, r0 + .5, r0 + .9))})`;
      // the world blooms out from the device
      const g = eOut(prog(t, r0 + .5, r0 + 1.0));
      vis(world, t >= r0 + .5 && t < Math.min(next + 1.0, 13.4));
      world.style.clipPath = `circle(${g * 130}% at 50% 42%)`;
      world.querySelector('img').style.transform = `scale(${lerp(1.25, 1.05, g) + .04*prog(t, r0+.5, r0+3)})`;
      // the result line
      pop(res, t, r0 + .6, .3);
      vis(res, t >= r0 + .6 && t < next);
    });
    $('ins').style.color = t >= 6.2 ? '#fff' : 'var(--ink)';
    drawConf(devConf, t, 6.0, 540, 400);
  }

  /* ---- proof 13.0-16.0 ---- */
  {
    const p = eOut(prog(t, 13.0, 13.3));
    const el = $('proof'); vis(el, t >= 13.0 && t < 16.4);
    el.style.transform = `translateY(${(1-p)*1920}px)`;
    pop($('pr-h'), t, 13.2, .35);
    [['p1',13.45,-5],['p2',13.95,6],['p3',14.45,-3]].forEach(([id, t0, r]) => pop($(id), t, t0, .35, `rotate(${r}deg)`));
    rise($('pr-cap'), t, 14.7, .3, 24);
  }

  /* ---- outro 16.0-22.5 ---- */
  {
    const p = eOut(prog(t, 16.0, 16.3));
    const el = $('out'); vis(el, t >= 16.0);
    el.style.transform = `translateX(${(1-p)*1080}px) rotate(${(1-p)*6}deg)`;
    rise($('o-logo'), t, 16.2, .35, 40);
    pop($('o-dev'), t, 16.3, .4);
    const f = eBack(prog(t, 16.55, 16.95));
    [[-22,-150],[22,150],[0,0]].forEach(([r, x], i) => {
      const c = $('o-c'+(i+1));
      c.style.opacity = clamp(prog(t, 16.5, 16.6));
      c.style.transform = `translateX(${x*f}px) rotate(${r*f}deg) translateY(${(1-clamp(f))*150}px)`;
    });
    rise($('o-h'), t, 16.7, .35, 50);
    $('o-hl').style.transform = `scaleX(${eOut(prog(t, 17.0, 17.3))})`;
    pop($('o-price'), t, 17.5, .35);
    rise($('o-sub'), t, 17.75, .3, 24);
    pop($('o-pill'), t, 18.0, .35, 'translateX(-50%)');
    if (t > 18.5) $('o-pill').style.transform += ` scale(${1 + .04*Math.max(0, Math.sin((t-18.5)*Math.PI*2))})`;
    drawConf(outConf, t, 17.0, 540, 700);
  }
};

window.ready = (async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.decode().catch(()=>{})));
  await document.fonts.load('900 100px Gabarito');
  await document.fonts.load('800 40px Gabarito');
  await document.fonts.load('800 38px "Hanken Grotesk"');
  window.render(0);
  return true;
})();
</script>
</body></html>
