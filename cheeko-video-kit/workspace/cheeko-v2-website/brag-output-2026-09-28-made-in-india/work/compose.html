<script>
const $ = id => document.getElementById(id);

  const p = prog(t, t0, t0+dur);

}

function seeded(s){ return () => (s = (s*16807) % 2147483647) / 2147483647; }
const COLORS = ['#F0521D','#FFC81A','#6C3DFF','#2F6B4F','#FFA9C9','#FFFFFF'];
function makeConf(host, n, seed) {
  const r = seeded(seed); const parts = [];
  for (let i=0;i<n;i++) {
    const d = document.createElement('div'); d.className='conf';
    d.style.background = COLORS[i % COLORS.length]; host.appendChild(d);
    const a = -Math.PI/2 + (r()-.5)*2.4, v = 1000 + r()*1500;
    parts.push({ d, vx: Math.cos(a)*v, vy: Math.sin(a)*v, spin: (r()-.5)*1400, w: .6 + r()*.8 });
  }
  return parts;
}
function drawConf(parts, t, t0, x0, y0) {
  const dt = t - t0;
  for (const p of parts) {
    if (dt < 0 || dt > 2.4) { p.d.style.opacity = 0; continue; }
    const drag = (1 - Math.exp(-dt*1.6)) / 1.6;
    p.d.style.opacity = clamp((2.4-dt)/.5);
    p.d.style.transform = `translate(${x0 + p.vx*drag}px,${y0 + p.vy*drag + 500*dt*dt}px) rotate(${p.spin*dt}deg) scale(${p.w}, ${Math.cos(dt*9+p.spin)})`;
  }
}
const conf1 = makeConf($('c1'), 80, 5), conf5 = makeConf($('c5'), 70, 11), conf8 = makeConf($('c8'), 90, 29);
// steam puffs out of the whistle
const PUFF = []; { const r = seeded(7); for (let i = 0; i < 26; i++) { const d = document.createElement('div'); d.className = 'puff'; $('puffs').appendChild(d);

  [15.2, 17.5, [["and", 15.28], ["when", 15.45], ["you", 15.6], ["interrupt?", 15.75], ["She", 16.47], ["listens!", 16.7, 1], ["💛", 16.82]]],

function renderCaps(t) {

const LANG = [[21.52,'अ','Noto Sans Devanagari','#FFC81A'],[22.22,'அ','Noto Sans Tamil','#FFA9C9'],[22.92,'ಅ','Noto Sans Kannada','#F0521D'],[23.7,'অ','Noto Sans Bengali','#FFF6E8'],[24.6,'A','Gabarito','#FFC81A']];

window.render = function(t) {

  /* S2 3.5-9.15: the card goes in; cooker + doorbell bubbles */
  vis($('s2'), t >= 3.5 && t < 9.4);

    $('ray2').style.transform = `rotate(${-t*20}deg)`;
    pop($('d2'), t, 3.55, .35);
    const c = prog(t, 4.45, 4.86), card = $('card');
    const bounce = t > 4.86 ? Math.sin(prog(t, 4.86, 5.1)*Math.PI) * -30 * (1-prog(t, 4.86, 5.1)) : 0;
    card.style.opacity = t >= 4.45 ? 1 : 0;

    const q = prog(t, 4.86, 5.1), sq = 1 + Math.sin(q*Math.PI)*.07;
    if (t > 3.95) $('d2').style.transform = `scale(${2-sq}, ${sq})`;
    vis($('scr2'), t >= 4.86 && t < 9.4);
    $('scr2').style.clipPath = `circle(${eOut(prog(t, 4.86, 5.1))*80}% at 50% 50%)`;
    pop($('b1'), t, 5.67, .3); $('b1').style.transform += ` rotate(${wob(t, 5.97, 6, 40, 3)}deg)`;
    pop($('b2'), t, 6.45, .3); $('b2').style.transform += ` rotate(${wob(t, 7.05, 16, 26, 2.2)}deg)`;
  }

  /* S3 9.1-12.55: made in India */

  }

  /* S4 12.5-17.55: Nani */
  vis($('s4'), t >= 12.5 && t < 17.8);
  {
    $('s4').style.clipPath = `circle(${eOut(prog(t, 12.5, 12.75))*150}% at 50% 50%)`;
    pop($('nani'), t, 12.56, .35);
    $('nani').style.transform += ` translateY(${Math.sin(t*2.2)*8}px) rotate(${t > 16.47 ? -6*eOut(prog(t, 16.47, 16.8)) : 0}deg)`;
    pop($('ncard'), t, 12.8, .3, 'rotate(-8deg)');

    pop($('wait'), t, 15.75, .25, 'rotate(-4deg)');
    pop($('heart'), t, 16.5, .3); $('heart').style.transform += ` translateY(${-prog(t, 16.5, 17.5)*40}px)`;
  }

  /* S5 17.5-21.5: imagine */
  vis($('imag'), t >= 17.5 && t < 21.75);
  {
    $('imag').style.clipPath = `circle(${eOut(prog(t, 17.5, 17.75))*150}% at 50% 100%)`;
    pop($('g-dev'), t, 17.55, .35);
    pop($('g-quote'), t, 17.6, .3);
    const Q = [...new Intl.Segmenter().segment(QUOTE)].map(g => g.segment), n = Math.round(Q.length * prog(t, 18.1, 19.6));

<script id="warp">
// Re-timed to the Upbeat Woman voiceover (2026-09-28): every scene keeps its original timing,
// stretched piecewise between voice-line anchors (see work/warp.json, built by marketing/tools/build_vo.py).
(() => { const NEW = [0.0, 0.05, 2.48, 4.311, 6.544, 7.667, 9.238, 10.734, 14.231, 17.087, 18.46, 19.656, 22.402, 24.125, 24.903, 25.708, 26.789, 27.993, 29.244, 31.379, 32.408, 33.325, 34.537, 37.09], OLD = [0.0, 0.03, 2.15, 3.56, 5.67, 6.45, 7.86, 9.18, 12.56, 15.28, 16.47, 17.58, 20.22, 21.52, 22.22, 22.92, 23.7, 24.6, 25.83, 27.74, 28.45, 29.24, 30.05, 32.6];
  const warp = t => { if (t <= NEW[0]) return OLD[0]; for (let i = 1; i < NEW.length; i++) if (t <= NEW[i]) return OLD[i-1] + (OLD[i]-OLD[i-1]) * (t-NEW[i-1]) / (NEW[i]-NEW[i-1]); return OLD[OLD.length-1] + (t - NEW[NEW.length-1]); };
  const R = window.render; window.render = t => R(warp(t)); })();
</script>
