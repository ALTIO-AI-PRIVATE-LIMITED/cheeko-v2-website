<script>
const $ = id => document.getElementById(id);
const clamp = (x,a=0,b=1) => Math.min(b, Math.max(a, x));
const prog = (t,a,b) => clamp((t-a)/(b-a));
const eOut = x => 1 - Math.pow(1-x, 3);
const eIn = x => x*x;
const eBack = x => { const c=2.2, d=c+1; return 1 + d*Math.pow(x-1,3) + c*Math.pow(x-1,2); };
const lerp = (a,b,x) => a + (b-a)*x;
const vis = (el, on) => el.style.visibility = on ? 'visible' : 'hidden';
function pop(el, t, t0, dur=.3, base='') {
  const p = prog(t, t0, t0+dur);
  el.style.opacity = clamp(p*3);
  el.style.transform = `${base} scale(${lerp(.3, 1, eBack(p))})`;
}
// a quick zoom "punch" at t0
const punch = (t, t0, amt=.08) => 1 + amt*Math.exp(-Math.max(0, t-t0)*9)*(t >= t0 ? 1 : 0);
function seeded(s){ return () => (s = (s*16807) % 2147483647) / 2147483647; }
const COLORS = ['#F0521D','#FFC81A','#6C3DFF','#2F6B4F','#FFA9C9','#FFFFFF'];
function makeConf(host, n, seed) {
  const r = seeded(seed); const parts = [];
  for (let i=0;i<n;i++) {
    const d = document.createElement('div'); d.className='conf';
    d.style.background = COLORS[i % COLORS.length]; host.appendChild(d);
    const a = -Math.PI/2 + (r()-.5)*2.4, v = 1000 + r()*1500;
    parts.push({ d, vx: Math.cos(a)*v, vy: Math.sin(a)*v, spin: (r()-.5)*1400, w: .6 + r()*.8 });
  }
  return parts;
}
function drawConf(parts, t, t0, x0, y0) {
  const dt = t - t0;
  for (const p of parts) {
    if (dt < 0 || dt > 2.4) { p.d.style.opacity = 0; continue; }
    const drag = (1 - Math.exp(-dt*1.6)) / 1.6;
    p.d.style.opacity = clamp((2.4-dt)/.5);
    p.d.style.transform = `translate(${x0 + p.vx*drag}px,${y0 + p.vy*drag + 500*dt*dt}px) rotate(${p.spin*dt}deg) scale(${p.w}, ${Math.cos(dt*9+p.spin)})`;
  }
}
const conf2 = makeConf($('c2'), 70, 5), conf6 = makeConf($('c6'), 70, 11), conf8 = makeConf($('c8'), 110, 17), conf9 = makeConf($('c9'), 90, 29);

/* captions: [start, end, [[word, t, highlight?], ...]] - times from vo/lines.json + silence gaps */
const CAPS = [
  [0.13, 3.25, [["फ़ोन", 0.15], ["ले", 0.49], ["लिया,", 0.66], ["और", 1.08], ["कोई", 1.25], ["रोना-धोना", 1.51], ["नहीं?!", 2.27, 1], ["😳", 2.39]]],
  [3.23, 5.12, [["क्योंकि", 3.25], ["अब", 3.87], ["है", 4.04], ["Cheeko!", 4.22], ["🦊", 4.34]]],
  [5.1, 6.49, [["कार्ड", 5.12], ["डालो,", 5.41], ["कहानी", 5.7], ["शुरू!", 5.99, 1], ["📖", 6.11]]],
  [6.47, 9.07, [["कुछ", 6.49], ["भी", 6.71], ["पूछो,", 6.86], ["और", 7.22], ["ये", 7.37], ["सच", 7.51], ["में", 7.66], ["जवाब", 7.88, 1], ["🗣️", 8.0], ["देता", 8.17], ["है!", 8.46]]],
  [9.05, 11.2, [["हिंदी,", 9.07, 1], ["तमिल,", 9.91], ["कन्नड़,", 10.59]]],
  [11.18, 12.66, [["दस", 11.2], ["भारतीय", 11.37, 1], ["भाषाएँ!", 11.86, 1], ["💬", 11.98]]],
  [12.64, 14.84, [["बोलो,", 12.66], ["साइकिल", 13.08], ["🚲", 13.2], ["चलाता", 13.59], ["टाइगर,", 14.01], ["🐯", 14.13]]],
  [14.82, 16.9, [["और", 14.84], ["BOOM,", 15.02], ["💥", 15.14], ["ड्रॉइंग", 15.45], ["तैयार!", 16.07, 1], ["🎨", 16.19]]],
];

// language glyphs
const GLY = [['अ','Noto Sans Devanagari','#FFC81A'],['அ','Noto Sans Tamil','#FFA9C9'],['ಅ','Noto Sans Kannada','#F0521D'],['అ','Noto Sans Telugu','#FFC81A'],
  ['অ','Noto Sans Bengali','#FFF6E8'],['અ','Noto Sans Gujarati','#FFA9C9'],['ਅ','Noto Sans Gurmukhi','#F0521D'],['അ','Noto Sans Malayalam','#FFF6E8'],
  ['ଅ','Noto Sans Oriya','#FFC81A'],['A','Gabarito','#F0521D']];
const GPOS = [[130,220],[410,150],[700,210],[940,420],[120,1000],[380,1080],[680,1060],[950,900],[110,560],[540,1590]];
GLY.forEach(([ch, font, bg], i) => {
  const d = document.createElement('div'); d.className = 'gly'; d.textContent = ch;
  d.style.fontFamily = `"${font}"`; d.style.background = bg;
  d.style.left = (GPOS[i][0] - 85) + 'px'; d.style.top = (GPOS[i][1] - 85) + 'px';
  $('glys').appendChild(d);
});
const BIG = [[9.2,'अ','Noto Sans Devanagari'],[9.95,'அ','Noto Sans Tamil'],[10.62,'ಅ','Noto Sans Kannada']];
const QUOTE = 'साइकिल चलाता टाइगर 🐯🚲';

// build caption spans once per line
const capEl = $('caps'); let capIdx = -1;
function renderCaps(t) {
  let i = CAPS.findIndex(([a, b]) => t >= a && t < b);
  if (i !== capIdx) {
    capEl.innerHTML = '';
    if (i >= 0) for (const [w, , hl] of CAPS[i][2]) {
      const s = document.createElement('span'); const emo = /\p{Extended_Pictographic}/u.test(w) && !/[\p{L}\p{N}]/u.test(w); s.className = 'w' + (emo ? ' emo' : hl ? ' hl' : ''); s.textContent = w; capEl.appendChild(s); capEl.appendChild(document.createTextNode(' '));
    }
    capIdx = i;
  }
  if (i < 0) return;
  [...capEl.querySelectorAll('.w')].forEach((s, k) => {
    const t0 = CAPS[i][2][k][1], p = prog(t, t0 - .04, t0 + .14);
    s.style.opacity = p > 0 ? 1 : 0;
    s.style.transform = `scale(${lerp(.5, 1, eBack(p))}) rotate(${CAPS[i][2][k][2] ? -3 : 0}deg)`;
  });
}

window.render = function(t) {
  /* S1 0-3.25 */
  vis($('s1'), t < 3.55);
  {
    const shake = t > 1.66 && t < 1.95 ? Math.sin(t*95) * 16 * (1 - prog(t, 1.66, 1.95)) : 0;
    $('s1a').style.transform = `scale(${lerp(1.05, 1.22, prog(t, 0, 2.2)) * punch(t, 1.66, .06)}) translateX(${shake}px)`;
    $('s1a').style.filter = `brightness(${.8 + .12*Math.sin(t*11)*Math.sin(t*3.1)})`;
    const x = prog(t, 1.62, 1.8);
    $('x').style.opacity = clamp(x*3) * (t < 2.19 ? 1 : 0);
    $('x').style.transform = `scale(${lerp(2.6, 1, eOut(x))}) rotate(${lerp(-30, -8, x)}deg)`;
    vis($('s1b'), t >= 2.17 && t < 3.55);
    $('s1b').style.transform = `scale(${1.25 * punch(t, 2.17, .1) - .1*prog(t, 2.17, 3.3)})`;
  }

  /* S2 3.25-6.49: sun burst, Cheeko drops in at 4.45, card in at 5.7 */
  const S2 = t >= 3.25 && t < 6.5;
  vis($('s2'), S2);
  {
    $('s2').style.clipPath = `circle(${eOut(prog(t, 3.25, 3.5))*150}% at 50% 40%)`;
    $('ray').style.transform = `rotate(${t*25}deg) scale(${lerp(.3, 1, eOut(prog(t, 3.3, 4.6)))})`;
    // device falls from above and lands on "Cheeko!"
    const d = prog(t, 4.05, 4.45);
    const land = prog(t, 4.45, 4.75), sq = 1 + Math.sin(land*Math.PI) * .14 * (1 - land*.3);
    const card = prog(t, 5.7, 5.95), sq2 = Math.sin(card*Math.PI) * .07;
    $('devwrap').style.opacity = t >= 4.05 ? 1 : 0;
    $('devwrap').style.transform = `translateY(${lerp(-1300, 0, eIn(d))}px) scale(${2-sq-sq2}, ${sq+sq2})`;
    // card drops into the slot, lands on "time!"
    const c = prog(t, 5.3, 5.7), cardEl = $('card');
    const bounce = t > 5.7 ? Math.sin(prog(t, 5.7, 5.95)*Math.PI) * -30 * (1-prog(t, 5.7, 5.95)) : 0;
    cardEl.style.opacity = t >= 5.3 ? 1 : 0;
    cardEl.style.top = (lerp(-560, 104, eIn(c)) + bounce) + 'px';
    cardEl.style.transform = `rotate(${lerp(12, 0, c)}deg)`;
    const sp = eOut(prog(t, 5.7, 5.95));
    vis($('scr'), S2 && t >= 5.7);
    $('scr').style.clipPath = `circle(${sp*80}% at 50% 50%)`;
    const g = eOut(prog(t, 5.7, 6.1));
    vis($('world'), S2 && t >= 5.7);
    $('world').style.clipPath = `circle(${g*130}% at 50% 30%)`;
    $('world').querySelector('img').style.transform = `scale(${lerp(1.3, 1.05, g)})`;
    drawConf(conf2, t, 4.47, 540, 700);
  }

  /* S4 6.49-9.05: talks back */
  vis($('s4'), t >= 6.49 && t < 9.1);
  $('s4a').style.transform = `scale(${lerp(1.18, 1.05, prog(t, 6.49, 9.05)) * punch(t, 8.15, .1)})`;

  /* S5 9.05-12.65: languages */
  vis($('lang'), t >= 9.05 && t < 12.95);
  {
    const b = [...BIG].reverse().find(([t0]) => t >= t0);
    const big = $('bigg');
    if (b && t < 11.25) {
      big.textContent = b[1]; big.style.fontFamily = `"${b[2]}"`;
      const p = prog(t, b[0], b[0] + .22);
      big.style.opacity = 1; big.style.transform = `scale(${lerp(.4, 1, eBack(p))}) rotate(${lerp(-12, 0, p)}deg)`;
    } else big.style.opacity = 0;
    [...$('glys').children].forEach((g, i) => {
      pop(g, t, 11.25 + i*.04, .3);
      g.style.transform += ` translateY(${Math.sin(t*2 + i)*10}px)`;
    });
  }

  /* S6 12.65-16.93: say a wish... BOOM */
  vis($('imag'), t >= 12.65 && t < 16.95);
  {
    $('imag').style.clipPath = `circle(${eOut(prog(t, 12.65, 12.9))*150}% at 50% 100%)`;
    pop($('g-quote'), t, 12.72, .3);
    const Q = [...new Intl.Segmenter().segment(QUOTE)].map(g => g.segment), n = Math.round(Q.length * prog(t, 13.28, 14.4));
    $('g-qt').textContent = Q.slice(0, Math.max(1, n)).join('');
    $('gi1').style.visibility = t < 13.28 ? 'inherit' : 'hidden'; $('gi2').style.visibility = t >= 13.28 && t < 14.5 ? 'inherit' : 'hidden'; $('gi3').style.visibility = t >= 14.5 ? 'inherit' : 'hidden';   // firmware Imagine screens: listening -> transcript -> painting
    vis($('g-draw'), t >= 15.08 && t < 16.95);
    $('g-draw').style.clipPath = `inset(0 0 ${(1 - eOut(prog(t, 15.08, 15.4)))*100}% 0)`;
    const q = prog(t, 15.08, 15.38), sq = 1 + Math.sin(q*Math.PI)*.12;
    $('g-dev').style.transform = `scale(${(2-sq) * lerp(1, 1.02, eOut(prog(t, 15.08, 16.9)))}, ${sq * lerp(1, 1.02, eOut(prog(t, 15.08, 16.9)))})`;
    $('ray2').style.opacity = t >= 15.08 ? 1 : 0;
    $('ray2').style.transform = `rotate(${t*30}deg) scale(${eOut(prog(t, 15.08, 15.6))})`;
    drawConf(conf6, t, 15.1, 540, 700);
  }
  $('flash').style.opacity = .9 * (1 - prog(t, 15.08, 15.3)) * (t >= 15.08 ? 1 : 0);

  /* S7 16.93-19.65: three stamps */
  [['st1', 16.93, 17.85], ['st2', 17.85, 18.67], ['st3', 18.67, 19.67]].forEach(([id, a, b]) => {
    const el = $(id); vis(el, t >= a && t < b);
    const s = prog(t, a, a + .16);
    el.querySelector('div').style.transform = `scale(${lerp(2.2, 1, eOut(s))}) rotate(${lerp(-8, -3, s)}deg)`;
    el.querySelector('div').style.opacity = clamp(s*2);
  });

  /* S8 19.65-21.05: just... play! */
  vis($('play'), t >= 19.65 && t < 21.35);
  {
    [['p1', 19.7, -5], ['p2', 19.85, 6], ['p3', 20.0, -3]].forEach(([id, t0, r]) => pop($(id), t, t0, .3, `rotate(${r}deg)`));
    pop($('pl-just'), t, 19.69, .25);
    pop($('pl-play'), t, 20.42, .3);
    drawConf(conf8, t, 20.44, 540, 1350);
  }

  /* S9 21.05-end: outro */
  vis($('out'), t >= 21.05);
  {
    const p = eOut(prog(t, 21.05, 21.3));
    $('out').style.transform = `translateY(${(1-p)*1920}px)`;
    pop($('o-dev'), t, 21.2, .35);
    const f = eBack(prog(t, 21.35, 21.75));
    [[-22,-150],[22,150],[0,0]].forEach(([r, x], i) => {
      const c = $('o-c'+(i+1));
      c.style.opacity = clamp(prog(t, 21.3, 21.4));
      c.style.transform = `translateX(${x*f}px) rotate(${r*f}deg) translateY(${(1-clamp(f))*150}px)`;
    });
    pop($('o-l1'), t, 21.09, .3);
    pop($('o-l2'), t, 22.05, .3);
    $('o-hl').style.transform = `scaleX(${eOut(prog(t, 22.4, 22.7))})`;
    pop($('o-logo'), t, 23.17, .35);
    $('o-logo').style.transform += ` rotate(${Math.sin(Math.max(0, t-23.17)*12) * 6 * Math.exp(-Math.max(0, t-23.17)*3)}deg)`;
    pop($('o-price'), t, 23.9, .3);
    pop($('o-pill'), t, 24.2, .3, 'translateX(-50%)');
    if (t > 24.7) $('o-pill').style.transform += ` scale(${1 + .05*Math.max(0, Math.sin((t-24.7)*Math.PI*2))})`;
    pop($('o-send'), t, 24.5, .3, 'translateX(-50%)');
    drawConf(conf9, t, 23.2, 540, 500);
  }

  renderCaps(t);
};

window.ready = (async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.decode().catch(()=>{})));
  const loads = ['900 100px Gabarito','800 40px Gabarito','800 38px "Hanken Grotesk"'];
  await Promise.all(loads.map(f => document.fonts.load(f)));
  await Promise.all(GLY.map(([ch, font]) => document.fonts.load(`800 100px "${font}"`, ch)));
  await document.fonts.load('900 100px "Noto Sans Devanagari"', 'अआ');
  await document.fonts.load('800 40px "Noto Sans Devanagari"', 'अआ');
  window.render(0);
  return true;
})();
</script>

<script id="warp">
// Re-timed to the Upbeat Woman voiceover (2026-09-28): every scene keeps its original timing,
// stretched piecewise between voice-line anchors (see work/warp.json, built by marketing/tools/build_vo.py).
(() => { const NEW = [0.0, 0.1, 3.365, 5.416, 7.042, 10.179, 10.872, 11.479, 12.16, 14.235, 16.425, 18.6, 19.314, 20.147, 21.155, 22.107, 23.025, 23.891, 25.0, 25.578, 28.2], OLD = [0.0, 0.15, 3.25, 5.12, 6.49, 9.07, 9.91, 10.59, 11.2, 12.66, 14.84, 16.93, 17.87, 18.69, 19.69, 20.42, 21.09, 22.05, 23.17, 23.88, 26.5];
  const warp = t => { if (t <= NEW[0]) return OLD[0]; for (let i = 1; i < NEW.length; i++) if (t <= NEW[i]) return OLD[i-1] + (OLD[i]-OLD[i-1]) * (t-NEW[i-1]) / (NEW[i]-NEW[i-1]); return OLD[OLD.length-1] + (t - NEW[NEW.length-1]); };
  const R = window.render; window.render = t => R(warp(t)); })();
</script>
