.scr img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;visibility:hidden}
.card{position:absolute;object-fit:cover;border:8px solid #fff;border-radius:24px;box-shadow:0 18px 36px rgba(0,0,0,.25)}
.ripple{position:absolute;border:10px solid #fff;border-radius:50%;opacity:0;pointer-events:none}
.chip{position:absolute;left:50%;white-space:nowrap;background:var(--ink);color:#fff;font-family:var(--disp);font-weight:900;font-size:58px;padding:16px 40px;border-radius:99px;box-shadow:0 14px 30px rgba(0,0,0,.25)}
.appcard{position:absolute;left:140px;top:150px;width:800px;height:1422px;border-radius:44px;overflow:hidden;box-shadow:0 34px 70px rgba(0,0,0,.35);border:10px solid #fff}
.appcard img{width:100%;height:100%;object-fit:cover}
.gly{position:absolute;width:170px;height:170px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:92px;font-weight:800;color:var(--ink);line-height:1}
.stamp{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;visibility:hidden}
.stamp div{font-family:var(--disp);font-weight:900;font-size:190px;letter-spacing:-.03em;color:#fff;text-align:center;line-height:.95}
.letter{position:absolute;width:118px;height:150px;border-radius:24px;background:#fff;box-shadow:0 14px 28px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:900;font-size:110px;color:var(--ink)}
.pol{position:absolute;padding:14px;background:#fff;border-radius:22px;box-shadow:0 24px 48px rgba(0,0,0,.3)}
.pol img{display:block;width:100%;height:100%;object-fit:cover;border-radius:10px}
.title{left:60px;right:60px;text-align:center;font-family:var(--disp);font-weight:900;color:#fff;line-height:1.02;paint-order:stroke fill;-webkit-text-stroke:16px var(--ink);text-shadow:0 10px 0 rgba(35,26,16,.35)}
.title .hl{color:var(--ink);-webkit-text-stroke:0;background:var(--sun);border-radius:.14em;padding:0 .12em;text-shadow:none}
.title .e{-webkit-text-stroke:0;text-shadow:none}
/* captions (narrator lines) */
#caps{position:absolute;left:80px;right:80px;top:1270px;z-index:50;text-align:center;font-family:var(--disp);font-weight:900;font-size:var(--capSize,90px);line-height:1.12}
#caps .w{display:inline-block;color:#fff;margin:0 .12em;paint-order:stroke fill;-webkit-text-stroke:14px var(--ink);text-shadow:0 8px 0 rgba(35,26,16,.35)}
#caps .w.hl{color:var(--ink);-webkit-text-stroke:0;background:var(--sun);border-radius:.18em;padding:0 .14em;text-shadow:none;box-shadow:0 8px 0 rgba(35,26,16,.35)}
#caps .w.emo{-webkit-text-stroke:0;text-shadow:none;background:none;box-shadow:none}
/* speech bubbles (characters and the kid) */
.bub{position:absolute;z-index:45;width:max-content;max-width:860px;padding:26px 38px 28px;border-radius:44px;font-family:var(--disp);font-weight:800;font-size:58px;line-height:1.15;color:var(--ink);box-shadow:0 18px 40px rgba(0,0,0,.28);visibility:hidden}
.bub .who{display:inline-block;font-size:34px;font-weight:900;padding:6px 20px;border-radius:99px;margin-bottom:10px;color:#fff}
.bub:after{content:"";position:absolute;width:44px;height:44px;background:inherit;transform:rotate(45deg);border-radius:6px}
.bub.top:after{bottom:-16px;left:calc(50% - 22px)}
.bub.kid:after{top:-16px;left:90px}
#flash{position:absolute;inset:0;background:#fff;z-index:60;opacity:0}

/* premium dark scenes (V19+): 3D phone with real app screens, cover-flow, sticker labels, notification */
.dark{background:radial-gradient(120% 70% at 50% 42%,#3A2414 0%,#1A120C 55%,#0E0A07 100%)}
.dark .glow{position:absolute;left:540px;top:760px;width:1100px;height:1100px;margin:-550px 0 0 -550px;border-radius:50%;background:radial-gradient(circle,rgba(240,82,29,.45),rgba(240,82,29,0) 62%)}
.grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:60px 60px}
.phone{position:absolute;border-radius:74px;background:#0B0B0D;padding:16px;box-shadow:0 60px 120px rgba(0,0,0,.6),0 0 0 3px #2A2A30 inset,0 0 0 2px #3A3A42;transform-style:preserve-3d}
.phone .ps{position:relative;width:100%;height:100%;border-radius:58px;overflow:hidden;background:#fff}
.phone .ps img{position:absolute;left:0;top:0;width:100%;display:block}
.phone .island{position:absolute;left:50%;top:30px;width:150px;height:44px;margin-left:-75px;border-radius:24px;background:#0B0B0D;z-index:3}
.phone .shine{position:absolute;inset:16px;border-radius:58px;background:linear-gradient(115deg,rgba(255,255,255,.18) 0%,rgba(255,255,255,0) 32%);pointer-events:none;z-index:2}
.tag{position:absolute;z-index:40;font-family:var(--disp);font-weight:900;font-size:58px;letter-spacing:.02em;padding:12px 30px 14px;border-radius:14px;box-shadow:0 18px 36px rgba(0,0,0,.4);white-space:nowrap;text-transform:uppercase}

const norm = w => w.replace(/[,.!?।:;"']/g, '').toLowerCase();
const CAPS = [];
LN.forEach((l, i) => {
  if (l.spk !== 'N' || S.noCaps?.includes(i)) return;
  const words = l.show.split(/\s+/).filter(Boolean), tot = words.reduce((a, w) => a + w.length + 2, 0);
  let acc = 0; const ws = [];
  const emo = Object.fromEntries(Object.entries(l.emoji || {}).map(([k, v]) => [norm(k), v]));
  const hl = new Set((l.hl || []).map(norm));
  const lastIdx = {}; words.forEach((w, k) => { if (emo[norm(w)]) lastIdx[norm(w)] = k; });   // emoji once, after the last match
  words.forEach((w, k) => { const tw = l.s + (l.e - l.s) * .92 * acc / tot; ws.push([w, tw, hl.has(norm(w))]); acc += w.length + 2;
    if (emo[norm(w)] && lastIdx[norm(w)] === k) ws.push([emo[norm(w)], tw + .12, false, true]); });
  const next = LN[i+1];   // a caption ends when the next line (any speaker) starts
  const end = Math.min(next ? next.s - .05 : 1e9, l.e + .8);
  if (!S.capMax) { CAPS.push([l.s - .05, end, ws]); return; }
  // S.capMax: page long lines into short chunks, breaking after a sentence end or comma where possible (walkthroughs)
  const pages = [[]]; let n = 0;
  ws.forEach(e => { const cur = pages[pages.length - 1];
    if (e[3]) { cur.push(e); return; }                                   // an emoji stays with its word
    const prev = cur.filter(x => !x[3]).pop(), brk = prev && (/[.!?]$/.test(prev[0]) ? n >= 3 : /,$/.test(prev[0]) ? n >= S.capMax - 2 : false);
    if (n >= S.capMax || brk) { pages.push([e]); n = 1; } else { cur.push(e); n++; } });
  pages.forEach((pg, k) => CAPS.push([k ? pg[0][1] - .05 : l.s - .05, pages[k+1] ? pages[k+1][0][1] - .05 : end, pg]));
});

}

  const [name, bg, chipBg] = WHO[l.spk] || [l.spk, '#fff', '#231A10'];
  let txt = l.show; for (const [k, v] of Object.entries(l.emoji || {})) { const re = new RegExp('(^|\\s)(' + k.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\$&') + '[!?.,।]*)(?=\\s|$)'); txt = txt.replace(re, '$1$2 ' + v); }
  const kid = l.spk === 'kid', pos = (S.bubbles || {})[i] || {};
  const b = el('div', 'bub ' + (kid ? 'kid' : 'top'), `<span class="who" style="background:${chipBg}">${name}</span><br>${txt}`, stage);
  b.style.background = bg; b.style.zIndex = 45;
  const y = pos.y ?? S.bubbleY ?? (kid ? 1180 : 170); b.style.top = y + 'px';
  if (kid) b.style.left = (pos.x ?? 70) + 'px'; else { b.style.left = '50%'; b.dataset.center = 1; }
  const next = LN[i+1];   // a bubble ends when the next line (any speaker) starts
  return {b, s: l.s - .12, e: pos.until ?? Math.min(next ? next.s - .1 : 1e9, l.e + .7), center: !kid};
}).filter(Boolean);

/* ---------- series badge ---------- */
const BADGE = S.badge ? el('div', 'badge', S.badge, stage) : null;
/* ---------- stickers (big emoji) ---------- */
const STK = (S.stickers || []).map(k => { const d = el('div', 'abs', k.emoji, stage); Object.assign(d.style, {left: k.x+'px', top: k.y+'px', fontSize: (k.size || 150)+'px', zIndex: 44, lineHeight: 1}); return {...k, d}; });


/* cues for synth.py (music and sound effects follow the shots) */
window.CUES = {dur: TM.dur, shots: SHOTS.map(s => [s.t, s.type]), bubbles: BUBS.map(b => b.s + .12),
  flashes: S.flashes || [], cards: SHOTS.filter(s => s.card).map(s => s.card.t), presses: SHOTS.flatMap(s => s.press || []),
  screens: SHOTS.flatMap(s => (s.screens || []).map(x => x[0])), stamps: SHOTS.flatMap(s => (s.items && s.type === 'stamps') ? s.items.map(x => x[0]) : []),
  letters: SHOTS.filter(s => s.type === 'letters').flatMap(s => s.word.split('').map((_, i) => lerp(s.from, s.to, i / s.word.length))),
  pops: SHOTS.flatMap(s => s.type === 'grid' ? s.items.map(x => x[0]) : []).concat(STK.map(k => k.t)),
  mood: S.mood || 'bright', outro: (SHOTS.find(s => s.type === 'outro') || {}).t, lastLine: (LN.filter(l => l.spk === 'N').slice(-1)[0] || {}).s, calm: S.calm || []};

window.render = function(t) {
  let cur = null;
  for (const s of SHOTS) {
    const on = t >= s.t && t < s.end + .42; vis(s.root, on);
    if (!on) continue;
    s.root.style.clipPath = s.i === 0 ? 'none' : `circle(${eOut(prog(t, s.t, s.t + .38))*150}% at ${s.origin || '50% 45%'})`;
    s.draw(t); if (t >= s.t) cur = s;
  }
  for (const k of BUBS) { const on = t >= k.s && t < k.e; vis(k.b, on); if (on) { const p = popS(t, k.s, .25); k.b.style.transform = (k.center ? 'translateX(-50%) ' : '') + `scale(${p})`; } }
  for (const k of STK) { const on = t >= k.t && t < k.until; k.d.style.opacity = on ? 1 : 0; if (on) k.d.style.transform = `scale(${popS(t, k.t, .3)}) rotate(${Math.sin(t*3)*6}deg)`; }
  $('#flash').style.opacity = (S.flashes || []).reduce((a, f) => Math.max(a, t >= f ? .85 * (1 - prog(t, f, f + .22)) : 0), 0);
  if (BADGE) { const ob = SHOTS.find(x => x.type === 'outro' || x.slate); BADGE.style.opacity = (cur && (cur.type === 'outro' || cur.slate || cur.nobadge)) ? 0 : 1; }
  renderCaps(t, cur);
};
window.ready = (async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
  await Promise.all(['900 100px Gabarito','800 40px Gabarito','800 38px "Hanken Grotesk"'].map(f => document.fonts.load(f)));
  await document.fonts.load('900 100px "Noto Sans Devanagari"', 'अआ');
  for (const f of ['Tamil','Kannada','Telugu','Bengali','Gujarati','Gurmukhi','Malayalam','Oriya']) await document.fonts.load(`800 100px "Noto Sans ${f}"`, 'அಅఅঅઅਅഅଅ');
  window.render(0); return true;
})();
</script>
