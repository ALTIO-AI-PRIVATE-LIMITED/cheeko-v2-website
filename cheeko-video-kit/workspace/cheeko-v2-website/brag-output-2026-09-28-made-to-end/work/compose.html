<style>

  --disp:"Gabarito",sans-serif;--body:"Hanken Grotesk",sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000}
.abs{position:absolute}
.layer{position:absolute;inset:0;overflow:hidden;visibility:hidden;z-index:0}
.disp{font-family:var(--disp);font-weight:900;letter-spacing:-.02em;line-height:1}
.center{left:0;right:0;text-align:center}
.full{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.conf{position:absolute;left:0;top:0;width:22px;height:14px;border-radius:3px;opacity:0}
#caps{position:absolute;left:90px;right:90px;top:1270px;z-index:50;text-align:center;font-family:var(--disp);font-weight:900;font-size:92px;line-height:1.12}
#caps .w{display:inline-block;color:#fff;margin:0 .12em;paint-order:stroke fill;-webkit-text-stroke:14px var(--ink);text-shadow:0 8px 0 rgba(35,26,16,.35)}
#caps .w.emo{-webkit-text-stroke:0;text-shadow:none;background:none;box-shadow:none;transform-origin:50% 60%}
#caps .w.hl{color:var(--ink);-webkit-text-stroke:0;background:var(--sun);border-radius:.18em;padding:0 .14em;text-shadow:none;box-shadow:0 8px 0 rgba(35,26,16,.35)}

#phone{left:250px;top:170px;width:580px;height:1060px;border-radius:78px;background:#0c0c10;padding:26px;box-shadow:0 40px 80px rgba(0,0,0,.6),inset 0 0 0 4px #2a2a33}

#feed{position:absolute;left:0;right:0;top:0}
.tile{height:330px;margin:14px;border-radius:26px;position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;left:24px;bottom:24px;width:60%;height:18px;border-radius:9px;background:rgba(255,255,255,.55)}
.tile::after{content:"";position:absolute;left:24px;bottom:56px;width:38%;height:18px;border-radius:9px;background:rgba(255,255,255,.35)}
.tile i{position:absolute;left:50%;top:44%;width:90px;height:90px;margin:-45px;border-radius:50%;background:rgba(255,255,255,.35)}
.tile i::after{content:"";position:absolute;left:36px;top:26px;border:20px solid transparent;border-left:30px solid #fff;border-right:0}

<script>
const $ = id => document.getElementById(id);
const clamp = (x,a=0,b=1) => Math.min(b, Math.max(a, x));
const prog = (t,a,b) => clamp((t-a)/(b-a));
const eOut = x => 1 - Math.pow(1-x, 3);
const eIn = x => x*x;
const eBack = x => { const c=2.2, d=c+1; return 1 + d*Math.pow(x-1,3) + c*Math.pow(x-1,2); };
const lerp = (a,b,x) => a + (b-a)*x;
const vis = (el, on) => el.style.visibility = on ? 'visible' : 'hidden';
function pop(el, t, t0, dur=.3, base='') {
  const p = prog(t, t0, t0+dur);
  el.style.opacity = clamp(p*3);
  el.style.transform = `${base} scale(${lerp(.3, 1, eBack(p))})`;
}
const punch = (t, t0, amt=.08) => 1 + amt*Math.exp(-Math.max(0, t-t0)*9)*(t >= t0 ? 1 : 0);
function seeded(s){ return () => (s = (s*16807) % 2147483647) / 2147483647; }
const COLORS = ['#F0521D','#FFC81A','#6C3DFF','#2F6B4F','#FFA9C9','#FFFFFF'];
function makeConf(host, n, seed) {
  const r = seeded(seed); const parts = [];
  for (let i=0;i<n;i++) {
    const d = document.createElement('div'); d.className='conf';
    d.style.background = COLORS[i % COLORS.length]; host.appendChild(d);
    const a = -Math.PI/2 + (r()-.5)*2.4, v = 1000 + r()*1500;
    parts.push({ d, vx: Math.cos(a)*v, vy: Math.sin(a)*v, spin: (r()-.5)*1400, w: .6 + r()*.8 });
  }
  return parts;
}
function drawConf(parts, t, t0, x0, y0) {
  const dt = t - t0;
  for (const p of parts) {
    if (dt < 0 || dt > 2.4) { p.d.style.opacity = 0; continue; }
    const drag = (1 - Math.exp(-dt*1.6)) / 1.6;
    p.d.style.opacity = clamp((2.4-dt)/.5);
    p.d.style.transform = `translate(${x0 + p.vx*drag}px,${y0 + p.vy*drag + 500*dt*dt}px) rotate(${p.spin*dt}deg) scale(${p.w}, ${Math.cos(dt*9+p.spin)})`;
  }
}
const conf2 = makeConf($('c2'), 70, 5), conf4 = makeConf($('c4'), 80, 11), conf7 = makeConf($('c7'), 90, 29);

// the endless feed: colourful placeholder "videos"
const TC = [['#ff5f6d','#ffc371'],['#7F7FD5','#91EAE4'],['#f7971e','#ffd200'],['#43cea2','#185a9d'],['#ee0979','#ff6a00'],['#8E2DE2','#4A00E0'],['#11998e','#38ef7d'],['#fc466b','#3f5efb']];
for (let i = 0; i < 40; i++) {
  const d = document.createElement('div'); d.className = 'tile';
  const [a, b] = TC[i % TC.length]; d.style.background = `linear-gradient(135deg, ${a}, ${b})`;
  d.appendChild(document.createElement('i')); $('feed').appendChild(d);
}
// stars
{ const r = seeded(3); for (let i = 0; i < 40; i++) { const s = document.createElement('div'); s.className = 'star';
  s.style.left = (r()*1080) + 'px'; s.style.top = (r()*1300) + 'px'; s.style.opacity = .3 + r()*.7; const k = 4 + r()*8; s.style.width = s.style.height = k + 'px'; $('stars').appendChild(s); } }

/* word-synced captions; times from vo/take1 silences, remapped after tightening */
const CAPS = [
  [0, 1.9, [["Your", 0.04], ["phone", 0.24], ["is", 0.5], ["built", 0.62], ["to", 0.85], ["NEVER", 1.0, 1], ["end.", 1.4], ["📱", 1.52]]],
  [1.95, 4.85, [["Scroll,", 2.01], ["scroll,", 2.91], ["scroll.", 3.85], ["😵", 3.97]]],
  [7.3, 10.65, [["No", 7.36], ["feed.", 7.6, 1], ["No", 8.3], ["videos.", 8.5, 1], ["Nothing", 9.42], ["to", 9.85], ["scroll.", 10.0, 1], ["🚫", 10.12]]],
  [17.6, 19.2, [["And", 17.66], ["when", 17.85], ["nobody's", 18.05], ["playing?", 18.5, 1], ["🧸", 18.62]]],
  [19.2, 21.45, [["It", 19.26], ["goes", 19.4], ["to", 19.62], ["sleep.", 19.85, 1], ["😴", 19.97], ["By", 20.39], ["itself.", 20.6], ["🌙", 20.72]]],
  [21.45, 22.6, [["Screens", 21.51], ["that", 21.95], ["END,", 22.15, 1]]],
  [22.6, 24.4, [["raise", 22.66], ["kids", 22.9], ["who", 23.1], ["know", 23.28], ["how", 23.45], ["to", 23.55], ["STOP.", 23.63, 1], ["✋", 23.75]]],
];
const capEl = $('caps'); let capIdx = -1;
function renderCaps(t) {
  let i = CAPS.findIndex(([a, b]) => t >= a && t < b);
  if (i !== capIdx) {
    capEl.innerHTML = '';
    if (i >= 0) for (const [w, , hl] of CAPS[i][2]) {
      const s = document.createElement('span'); const emo = /\p{Extended_Pictographic}/u.test(w) && !/[\p{L}\p{N}]/u.test(w); s.className = 'w' + (emo ? ' emo' : hl ? ' hl' : ''); s.textContent = w; capEl.appendChild(s); capEl.appendChild(document.createTextNode(' '));
    }
    capIdx = i;
  }
  if (i < 0) return;
  [...capEl.querySelectorAll('.w')].forEach((s, k) => {
    const t0 = CAPS[i][2][k][1], p = prog(t, t0 - .04, t0 + .14);
    s.style.opacity = p > 0 ? 1 : 0;
    s.style.transform = `scale(${lerp(.5, 1, eBack(p))}) rotate(${CAPS[i][2][k][2] ? -3 : 0}deg)`;
  });
}
const MENU = [12.76, 13.34, 14.06, 14.71, 15.43];

window.render = function(t) {
  /* S1 0-4.9: the feed never ends; each "scroll" flicks it up */
  vis($('s1'), t < 5.15);
  {
    let y = t * 180;                                          // slow constant drift
    for (const s of [2.01, 2.91, 3.85]) y += 344 * 2 * eOut(prog(t, s, s + .35));   // a flick on every "scroll"
    y += 3000 * eIn(prog(t, 4.3, 4.85));                      // spins out of control
    $('feed').style.transform = `translateY(${-(y % (344*8*4))}px)`;
    $('feed').style.filter = `blur(${8*prog(t, 4.3, 4.7)}px)`;
    const yank = eIn(prog(t, 4.75, 5.1));
    $('phone').style.transform = `translateY(${-yank*1900}px) rotate(${yank*-14}deg) scale(${punch(t, 1.0, .04) * punch(t, 2.01, .03) * punch(t, 2.91, .03) * punch(t, 3.85, .03)})`;
  }

  /* S2 4.85-7.35: Cheeko? Built to END! */
  vis($('s2'), t >= 4.85 && t < 7.6);
  {
    $('s2').style.clipPath = `circle(${eOut(prog(t, 4.85, 5.1))*150}% at 50% 40%)`;
    $('ray').style.transform = `rotate(${t*25}deg)`;
    pop($('d2'), t, 4.9, .35);
    const land = prog(t, 6.08, 6.35), sq = 1 + Math.sin(land*Math.PI)*.14;
    const wig = t > 6.61 ? Math.sin((t-6.61)*28) * 7 * Math.exp(-(t-6.61)*3) : 0;   // giggle on the laugh
    if (t > 5.25) $('d2').style.transform = `scale(${2-sq}, ${sq}) rotate(${wig}deg)`;
    pop($('q'), t, 4.95, .3, 'rotate(12deg)'); vis($('q'), t < 5.64);
    pop($('end'), t, 5.64, .3);
    $('end').querySelector('span').style.display = t >= 6.0 ? 'inline' : 'none';
    drawConf(conf2, t, 6.1, 540, 650);
  }

  /* S3 7.3-10.7: icons struck out */
  vis($('s3'), t >= 7.3 && t < 10.95);
  {
    $('s3').style.transform = `translateY(${(1-eOut(prog(t, 7.3, 7.55)))*1920}px)`;
    [['ic1','k1',7.36],['ic2','k2',8.3],['ic3','k3',9.42]].forEach(([ic, k, t0]) => {
      pop($(ic), t, t0 - .08, .28);
      $(k).style.transform = `rotate(-38deg) scaleX(${eOut(prog(t, t0 + .25, t0 + .45))})`;
    });
  }

  /* S4 10.65-17.65: the five menus, "That's it!" */
  vis($('s4'), t >= 10.65 && t < 17.9);
  {
    $('s4').style.clipPath = `circle(${eOut(prog(t, 10.65, 10.95))*150}% at 50% 60%)`;
    pop($('s4h'), t, 10.72, .3);
    pop($('d4'), t, 10.8, .35);
    const cur = Math.max(0, MENU.filter(x => t >= x).length - 1);   // Talk is already on screen before it's named
    MENU.forEach((x, i) => {
      const m = $('m'+i); vis(m, t >= 10.65 && t < 17.9 && i === cur);
      m.style.transform = i ? `translateX(${(1-eOut(prog(t, x, x+.18)))*100}%)` : '';
    });
    if (t >= MENU[0]) $('d4').style.transform = `scale(${punch(t, MENU[cur], .05)})`;
    const cnt = $('cnt'); cnt.textContent = `${Math.max(1, cur+1)} / 5`;
    pop(cnt, t, 12.76, .25, 'translateX(-50%)');
    if (t >= MENU[0]) cnt.style.transform = `translateX(-50%) scale(${punch(t, MENU[cur], .2)})`;
    vis(cnt, t >= 12.7 && t < 16.5);
    pop($('thats'), t, 16.57, .3, 'rotate(-4deg)'); vis($('thats'), t >= 16.5);
    drawConf(conf4, t, 16.6, 540, 1300);
  }

  /* S5 17.6-21.5: it goes to sleep, by itself */
  vis($('s5'), t >= 17.6 && t < 21.75);
  {
    $('s5').style.clipPath = `circle(${eOut(prog(t, 17.6, 17.9))*150}% at 50% 0%)`;
    $('dim').style.opacity = eIn(prog(t, 19.3, 20.2));
    $('d5img').style.filter = `drop-shadow(0 30px 40px rgba(0,0,0,.5)) brightness(${lerp(1, .55, prog(t, 19.3, 20.4))})`;
    [['z1', 19.9], ['z2', 20.15], ['z3', 20.4]].forEach(([id, t0], i) => {
      const p = prog(t, t0, t0 + 1.4), el = $(id);
      el.style.opacity = clamp(p*4) * (1 - prog(t, t0 + 1.0, t0 + 1.4));
      el.style.transform = `translate(${Math.sin((t-t0)*3 + i)*20}px, ${-p*120}px) rotate(${-10 + i*8}deg)`;
    });
  }

  /* S6 21.45-24.45: kids who know how to stop */
  vis($('s6'), t >= 21.45 && t < 24.7);
  {
    $('s6').style.clipPath = `circle(${eOut(prog(t, 21.45, 21.7))*150}% at 50% 50%)`;
    $('k6a').style.transform = `scale(${lerp(1.15, 1.05, prog(t, 21.45, 22.66))})`;
    vis($('k6b'), t >= 22.62 && t < 24.7);
    $('k6b').style.transform = `scale(${lerp(1.12, 1.02, prog(t, 22.62, 24.45)) * punch(t, 23.63, .07)})`;
  }

  /* S7 24.4-end: outro */
  vis($('out'), t >= 24.4);
  {
    $('out').style.transform = `translateY(${(1-eOut(prog(t, 24.4, 24.65)))*1920}px)`;
    pop($('o-logo'), t, 24.47, .35);
    $('o-logo').style.transform += ` rotate(${Math.sin(Math.max(0, t-24.47)*12) * 6 * Math.exp(-Math.max(0, t-24.47)*3)}deg)`;
    pop($('o-dev'), t, 24.55, .35);
    const f = eBack(prog(t, 24.7, 25.1));
    [[-22,-150],[22,150],[0,0]].forEach(([r, x], i) => {
      const c = $('o-c'+(i+1));
      c.style.opacity = clamp(prog(t, 24.65, 24.75));
      c.style.transform = `translateX(${x*f}px) rotate(${r*f}deg) translateY(${(1-clamp(f))*150}px)`;
    });
    pop($('o-l1'), t, 25.26, .3);
    pop($('o-l2'), t, 26.17, .3);
    $('o-hl').style.transform = `scaleX(${eOut(prog(t, 26.5, 26.8))})`;
    pop($('o-price'), t, 27.3, .3);
    pop($('o-pill'), t, 27.6, .3, 'translateX(-50%)');
    if (t > 28.1) $('o-pill').style.transform += ` scale(${1 + .05*Math.max(0, Math.sin((t-28.1)*Math.PI*2))})`;
    pop($('o-send'), t, 27.9, .3, 'translateX(-50%)');
    drawConf(conf7, t, 26.55, 540, 500);
  }
  renderCaps(t);
};

window.ready = (async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.decode().catch(()=>{})));
  await Promise.all(['900 100px Gabarito','800 40px Gabarito','800 38px "Hanken Grotesk"'].map(f => document.fonts.load(f)));
  window.render(0);
  return true;
})();
</script>

<script id="warp">
// Re-timed to the Upbeat Woman voiceover (2026-09-28): every scene keeps its original timing,
// stretched piecewise between voice-line anchors (see work/warp.json, built by marketing/tools/build_vo.py).
(() => { const NEW = [0.0, 0.05, 2.695, 3.652, 4.715, 5.997, 6.955, 9.199, 10.144, 11.443, 12.768, 14.658, 15.364, 16.229, 17.242, 18.182, 19.337, 20.719, 22.372, 23.659, 24.944, 26.324, 28.666, 29.489, 30.601, 32.026, 34.61], OLD = [0.0, 0.04, 2.01, 2.91, 3.85, 4.9, 5.64, 7.36, 8.3, 9.42, 10.71, 12.76, 13.34, 14.06, 14.71, 15.43, 16.57, 17.66, 19.26, 20.39, 21.51, 22.66, 24.47, 25.26, 26.17, 27.22, 29.8];
  const warp = t => { if (t <= NEW[0]) return OLD[0]; for (let i = 1; i < NEW.length; i++) if (t <= NEW[i]) return OLD[i-1] + (OLD[i]-OLD[i-1]) * (t-NEW[i-1]) / (NEW[i]-NEW[i-1]); return OLD[OLD.length-1] + (t - NEW[NEW.length-1]); };
  const R = window.render; window.render = t => R(warp(t)); })();
</script>
