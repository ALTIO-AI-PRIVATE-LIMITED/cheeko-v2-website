<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@800;900&family=Noto+Sans+Devanagari:wght@800;900&family=Hanken+Grotesk:wght@800&display=block">
<style>
:root{--brand:#F0521D;--sun:#FFC81A;--ink:#231A10;--tint:#FFF4E3;--purple:#6C3DFF;--green:#2F6B4F;--red:#E5341B;
  --disp:"Gabarito","Noto Sans Devanagari",sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
#t{position:relative;width:1080px;height:1920px;overflow:hidden}
.abs{position:absolute}
.ray{position:absolute;left:540px;top:1060px;width:3000px;height:3000px;margin:-1500px 0 0 -1500px;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.16) 0 10deg,rgba(255,255,255,0) 10deg 20deg)}
#logo{left:50%;top:250px;width:300px;transform:translateX(-50%)}
#hook{left:50px;right:50px;top:380px;text-align:center;font-family:var(--disp);font-weight:900;line-height:1.02;letter-spacing:-.02em;color:#fff;
  paint-order:stroke fill;-webkit-text-stroke:18px var(--ink);text-shadow:0 12px 0 rgba(35,26,16,.35)}
#hook .hl{color:var(--ink);-webkit-text-stroke:0;background:var(--sun);border-radius:.14em;padding:0 .12em;text-shadow:none;box-shadow:0 12px 0 rgba(35,26,16,.35)}
#hook .e{-webkit-text-stroke:0;text-shadow:none;font-family:"Apple Color Emoji"}
.photo{border-radius:56px;overflow:hidden;border:14px solid #fff;box-shadow:0 30px 60px rgba(0,0,0,.35)}
.photo img{width:100%;height:100%;object-fit:cover}
.card{border-radius:24px;border:8px solid #fff;box-shadow:0 20px 40px rgba(0,0,0,.3);object-fit:cover}
.dev{filter:drop-shadow(0 34px 44px rgba(0,0,0,.35))}
.sticker{display:flex;align-items:center;justify-content:center;border-radius:50%;background:#fff;box-shadow:0 18px 36px rgba(0,0,0,.3);font-family:"Apple Color Emoji"}
.pill{left:50%;transform:translateX(-50%);white-space:nowrap;background:var(--ink);color:#fff;font-family:var(--disp);font-weight:900;border-radius:99px;padding:18px 44px;font-size:52px}
.iph{background:linear-gradient(135deg,#5f5c58 0%,#c9c5be 18%,#efece6 30%,#a9a59f 46%,#6d6a66 62%,#d6d2cb 80%,#77746f 100%);box-shadow:0 40px 80px rgba(0,0,0,.4),0 0 0 1.5px rgba(0,0,0,.35)}
.iph .bz{position:absolute;background:#040404}
.iph .ps{position:absolute;overflow:hidden;background:#fff}
.iph .ps img{position:absolute;left:0;top:0;width:100%}
.iph .tm{position:absolute;font-family:-apple-system,"SF Pro Text",sans-serif;font-weight:600;text-align:center;color:#000}
.iph .isl{position:absolute;background:#000}
</style></head>
<body><div id="t"></div>
<script>
const SPEC = JSON.parse(decodeURIComponent(location.hash.slice(1)));
const A = '../assets/img/';
const phoneX = (x, y, s) => `<div class="abs" style="left:${x}px;top:${y}px;width:${240*s}px;height:${440*s}px;border-radius:${46*s}px;background:#111;box-shadow:0 20px 40px rgba(0,0,0,.35);transform:rotate(-10deg)">
  <div style="position:absolute;inset:${12*s}px;border-radius:${34*s}px;background:linear-gradient(160deg,#ff5f6d,#6C3DFF 60%,#11998e)"></div>
  <svg style="position:absolute;left:${-20*s}px;top:${80*s}px;width:${280*s}px;height:${280*s}px" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" fill="none" stroke="#E5341B" stroke-width="9"/><path d="M30 30 70 70M70 30 30 70" stroke="#E5341B" stroke-width="11" stroke-linecap="round"/></svg></div>`;
const cooker = (x, y, w) => `<svg class="abs" style="left:${x}px;top:${y}px;width:${w}px;height:${w}px" viewBox="0 0 200 200">
  <circle cx="92" cy="18" r="10" fill="#fff" opacity=".9"/><circle cx="108" cy="6" r="13" fill="#fff" opacity=".8"/><circle cx="84" cy="-2" r="8" fill="#fff" opacity=".7"/>
  <rect x="93" y="30" width="14" height="16" rx="3" fill="#3a3a3a"/><rect x="89" y="24" width="22" height="9" rx="4" fill="#555"/>
  <rect x="104" y="58" width="92" height="14" rx="7" fill="#231A10"/><rect x="4" y="60" width="44" height="11" rx="5" fill="#231A10"/>
  <ellipse cx="100" cy="62" rx="62" ry="14" fill="#cfd6dc"/><path d="M34 66 Q30 150 50 172 Q100 188 150 172 Q170 150 166 66 Z" fill="#dfe5ea"/>
  <path d="M44 80 Q42 145 58 164" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" opacity=".8"/>
  <path d="M34 66 Q100 84 166 66" stroke="#b9c1c8" stroke-width="5" fill="none"/><ellipse cx="100" cy="46" rx="16" ry="6" fill="#aab3bb"/></svg>`;
const V06 = '../brag-output-2026-09-29-five-minutes/work/stickers/';
const STK = `<svg width="0" height="0" style="position:absolute"><filter id="stk" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
  <feComponentTransfer in="SourceAlpha" result="a"><feFuncA type="discrete" tableValues="0 1 1 1 1 1 1 1"/></feComponentTransfer>
  <feMorphology in="a" operator="dilate" radius="12" result="d"/><feFlood flood-color="#fff"/><feComposite in2="d" operator="in" result="b"/>
  <feGaussianBlur in="d" stdDeviation="8"/><feOffset dx="6" dy="14" result="o"/><feFlood flood-color="#231A10" flood-opacity=".3"/><feComposite in2="o" operator="in" result="s"/>
  <feMerge><feMergeNode in="s"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></svg>`;
const stickerPhone = (x, y, w, face, rot) => `<div class="abs" style="left:${x}px;top:${y}px;width:${w}px;height:${w*1.79}px;border-radius:${w*.21}px;background:#262A38;border:${w*.037}px solid #111;padding:${w*.084}px ${w*.063}px;transform:rotate(${rot}deg);filter:url(#stk)">
  <div style="width:100%;height:100%;border-radius:${w*.14}px;background:linear-gradient(165deg,#DDEBFF,#9DBEFF);display:flex;align-items:center;justify-content:center;font-size:${w*.62}px;font-family:'Apple Color Emoji'">${face}</div></div>`;
const V07 = '../brag-output-2026-09-29-tiny-adults/work/stickers/';
const iphone = it => { const BW = it.w, fr = BW*.013, bz = BW*.032, off = fr + bz, SW = BW - 2*off, SH = SW*852/393, BH = SH + 2*off, u = SW/393, rS = 55*u;
  const sig = [4, 6.2, 8.4, 10.8].map((h, i) => `<rect x="${i*4.6}" y="${11.4-h}" width="3.1" height="${h}" rx=".9"/>`).join('');
  return `<div class="abs iph" style="left:${it.x}px;top:${it.y}px;width:${BW}px;height:${BH}px;border-radius:${rS+bz+fr}px;transform:rotate(${it.r||0}deg)">
    <div class="bz" style="left:${fr}px;top:${fr}px;right:${fr}px;bottom:${fr}px;border-radius:${rS+bz}px">
      <div class="ps" style="left:${bz}px;top:${bz}px;width:${SW}px;height:${SH}px;border-radius:${rS}px"><img src="${A}${it.src}" style="transform:translateY(${-(it.scroll||0)}%)"></div>
      <div class="tm" style="left:${bz+22*u}px;width:${90*u}px;top:${bz+19*u}px;font-size:${17*u}px;line-height:${22*u}px">9:41</div>
      <svg viewBox="0 0 72 12.6" style="position:absolute;right:${bz+22*u}px;top:${bz+23.5*u}px;width:${72*u}px;height:${12.6*u}px" fill="#000">${sig}<g transform="translate(24.5 0)"><path d="M7.7 11.4 L5.2 8.6 A3.6 3.6 0 0 1 10.2 8.6 Z"/><path d="M3.3 6.6 A6.4 6.4 0 0 1 12.1 6.6 L10.9 8 A4.7 4.7 0 0 0 4.5 8 Z"/><path d="M1.1 4.2 A9.6 9.6 0 0 1 14.3 4.2 L13.1 5.6 A7.9 7.9 0 0 0 2.3 5.6 Z"/></g><g transform="translate(46 0)"><rect x=".5" y=".6" width="24" height="11.4" rx="3.6" fill="none" stroke="#000" stroke-opacity=".4"/><rect x="2.4" y="2.5" width="17.6" height="7.6" rx="2"/></g></svg>
      <div class="isl" style="left:${bz+SW/2-63*u}px;top:${bz+11*u}px;width:${126*u}px;height:${37*u}px;border-radius:${19*u}px"></div>
    </div></div>`; };
const ITEM = it => it.kind === 'iphone' ? iphone(it)
  : it.kind === 'card' ? `<img class="abs card" src="${A}${it.src}" style="left:${it.x}px;top:${it.y}px;width:${it.w}px;height:${Math.round(it.w*1.574)}px;transform:rotate(${it.r||0}deg)">`
  : it.kind === 'photo' ? `<div class="abs photo" style="left:${it.x}px;top:${it.y}px;width:${it.w}px;height:${it.h}px;transform:rotate(${it.r||0}deg)"><img src="${A}${it.src}" style="object-position:${it.pos||'50% 50%'}"></div>`
  : it.kind === 'dev' ? `<img class="abs dev" src="${it.src}" style="left:${it.x}px;top:${it.y}px;width:${it.w}px;transform:rotate(${it.r||0}deg)">`
  : it.kind === 'img' ? `<img class="abs" src="${A}${it.src}" style="left:${it.x}px;top:${it.y}px;width:${it.w}px;transform:rotate(${it.r||0}deg)">`
  : `<div class="abs sticker" style="left:${it.x}px;top:${it.y}px;width:${it.size||150}px;height:${it.size||150}px;font-size:${Math.round((it.size||150)*.58)}px">${it.emoji}</div>`;
const LAYOUT = {
  hero: () => (SPEC.items || []).map(ITEM).join(''),
  tinyadults: () => `${STK}<img class="abs" src="${V07}corp-adult.png" style="left:40px;top:800px;width:330px;filter:url(#stk);transform:rotate(-5deg)">
    <img class="abs" src="${V07}news-adult.png" style="left:370px;top:760px;width:360px;filter:url(#stk)">
    <img class="abs" src="${V07}uncle-adult.png" style="left:720px;top:820px;width:330px;filter:url(#stk);transform:rotate(5deg)">
    <img class="abs dev" src="${A}device_current.png" style="left:820px;top:1260px;width:190px;transform:rotate(8deg);filter:url(#stk)">`,
  phonepov: () => `${STK}<img class="abs" src="${V06}p04.png" style="left:110px;top:840px;width:860px;filter:url(#stk);transform:rotate(-2deg)">
    ${stickerPhone(800, 760, 190, '🥲', 10)}
    <img class="abs dev" src="${A}device_current.png" style="left:70px;top:1190px;width:230px;transform:rotate(-8deg);filter:url(#stk)">`,
  features: () => `<img class="abs card" src="${A}cards-shipping/07-clever-little-tales.jpg" style="left:150px;top:1010px;width:250px;height:394px;transform:rotate(-16deg)">
    <img class="abs card" src="${A}cards-shipping/10-nani.jpg" style="left:680px;top:1010px;width:250px;height:394px;transform:rotate(16deg)">
    <img class="abs dev" src="dev2/menu.png" style="left:343px;top:900px;width:420px">
    <div class="abs sticker" style="left:110px;top:900px;width:150px;height:150px;font-size:86px">🎨</div>
    <div class="abs sticker" style="left:820px;top:880px;width:150px;height:150px;font-size:86px">🎮</div>`,
  cards: () => `<div class="abs photo" style="left:110px;top:900px;width:860px;height:640px;transform:rotate(-3deg)"><img src="${A}live/hero-kid-slot.jpg" style="object-position:50% 45%"></div>
    <img class="abs card" src="${A}cards-shipping/01-tales-of-kindness.jpg" style="left:760px;top:760px;width:220px;height:346px;transform:rotate(12deg)">`,
  tantrum: () => `<div class="abs photo" style="left:250px;top:880px;width:680px;height:680px;transform:rotate(3deg)"><img src="${A}live/kid-toddler.jpg" style="object-position:45% 35%"></div>
    ${phoneX(60, 1000, 1)}`,
  end: () => `<img class="abs dev" src="${A}device_current.png" style="left:450px;top:860px;width:450px;transform:rotate(6deg)">${phoneX(130, 1020, 1.05)}`,
  sound: () => `${cooker(250, 880, 560)}<div class="abs sticker" style="left:760px;top:900px;width:170px;height:170px;font-size:100px">👂</div>
    <div class="abs" style="left:120px;top:1330px;width:300px;height:300px;border-radius:50%;border:12px solid var(--brand);background:var(--tint);transform:rotate(-12deg);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--disp);font-weight:900;color:var(--brand);line-height:.95;text-align:center">
    <div style="font-size:${SPEC.hi ? 54 : 56}px">${SPEC.hi ? 'मेड इन' : 'MADE IN'}</div><div style="font-size:${SPEC.hi ? 84 : 90}px">${SPEC.hi ? 'इंडिया' : 'INDIA'}</div></div>
    <img class="abs dev" src="${A}device_current.png" style="left:700px;top:1150px;width:260px;transform:rotate(8deg)">`,
};
document.getElementById('t').style.background = SPEC.bg;
document.getElementById('t').innerHTML = `<div class="ray"></div>
  <img class="abs" id="logo" src="${A}logo.png">
  <div class="abs" id="hook" style="font-size:${SPEC.size}px">${SPEC.hook}</div>
  ${LAYOUT[SPEC.layout]()}
  ${SPEC.pill ? `<div class="abs pill" style="top:1600px">${SPEC.pill}</div>` : ''}`;
window.ready = (async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
  await document.fonts.load('900 100px Gabarito'); await document.fonts.load('900 100px "Noto Sans Devanagari"', 'अआ');
  return true;
})();
</script>
</body></html>
