<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Meet the Characters | Option A: Character Select</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="assets/img/logo.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gabarito:wght@600;700;800;900&family=Hanken+Grotesk:wght@400;600;800&family=Spline+Sans+Mono:wght@500;700&display=swap" />
<link rel="stylesheet" href="assets/css/premium.css?v=64" />
<style>
.badge{position:fixed;top:14px;left:14px;z-index:60;background:var(--brand);color:#fff;font:700 12px/1 "Spline Sans Mono",monospace;letter-spacing:.14em;padding:9px 14px;border-radius:99px;box-shadow:0 6px 18px rgba(240,82,29,.4)}
.backlink{position:fixed;top:14px;right:14px;z-index:60;background:#fff;color:var(--ink);font:600 13px/1 "Hanken Grotesk",sans-serif;padding:9px 14px;border-radius:99px;text-decoration:none;box-shadow:0 4px 14px rgba(35,26,16,.15)}
.stagewrap{min-height:100svh;background:#17130E;display:flex;flex-direction:column;justify-content:center;padding:84px 20px 30px;overflow:hidden}
.stagehead{text-align:center;margin-bottom:8px}
.stagehead .kick{font:700 12px/1 "Spline Sans Mono",monospace;letter-spacing:.22em;color:var(--sun);text-transform:uppercase}
.stagehead h1{font:800 clamp(30px,5.4vw,54px)/1.05 "Gabarito",sans-serif;color:#FFF4E3;margin:10px 0 0}
.stage{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:24px;max-width:980px;margin:0 auto;width:100%}
.podium{position:relative;display:flex;align-items:flex-end;justify-content:center;height:min(44svh,400px)}
.podium::before{content:"";position:absolute;inset:auto 0 -8px;margin:auto;width:78%;height:120px;background:radial-gradient(closest-side,rgba(255,200,26,.38),transparent 70%);filter:blur(6px)}
.podium::after{content:"";position:absolute;bottom:2px;left:50%;transform:translateX(-50%);width:62%;height:16px;background:radial-gradient(closest-side,rgba(0,0,0,.65),transparent);border-radius:50%}
.podium img{position:relative;z-index:2;max-height:100%;max-width:88%;object-fit:contain;filter:drop-shadow(0 18px 34px rgba(0,0,0,.5));transition:opacity .25s,transform .25s}
.podium img.swap{opacity:0;transform:translateY(10px) scale(.97)}
.sheet{color:#FFF4E3}
.sheet .chip{display:inline-block;font:700 11px/1 "Spline Sans Mono",monospace;letter-spacing:.16em;text-transform:uppercase;background:rgba(255,200,26,.16);color:var(--sun);border:1px solid rgba(255,200,26,.4);padding:8px 13px;border-radius:99px}
.sheet h2{font:900 clamp(42px,7vw,74px)/1 "Gabarito",sans-serif;margin:14px 0 4px}
.sheet .role{font:700 15px/1.3 "Spline Sans Mono",monospace;color:rgba(255,244,227,.55);letter-spacing:.06em;text-transform:uppercase}
.sheet p{font:400 clamp(16px,2vw,19px)/1.55 "Hanken Grotesk",sans-serif;color:rgba(255,244,227,.9);margin:14px 0 20px;max-width:40ch}
.hearbtn{display:inline-flex;align-items:center;gap:10px;background:var(--brand);color:#fff;border:none;cursor:pointer;font:800 16px/1 "Gabarito",sans-serif;padding:15px 24px;border-radius:99px;box-shadow:0 10px 26px rgba(240,82,29,.45)}
.hearbtn i{font-style:normal}
.selectrail{display:flex;gap:12px;justify-content:center;flex-wrap:nowrap;overflow-x:auto;padding:26px 12px 8px;max-width:980px;margin:0 auto;width:100%;-webkit-overflow-scrolling:touch}
.selectrail button{flex:0 0 auto;width:76px;height:76px;border-radius:24px;border:2px solid rgba(255,244,227,.14);background:rgba(255,244,227,.06);cursor:pointer;padding:8px;transition:.2s;position:relative}
.selectrail button img{width:100%;height:100%;object-fit:contain}
.selectrail button.on{border-color:var(--sun);background:rgba(255,200,26,.14);transform:translateY(-6px)}
.selectrail button.on::after{content:"";position:absolute;bottom:-12px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:var(--sun)}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(80px);background:#FFF4E3;color:var(--ink);font:600 14px/1 "Hanken Grotesk",sans-serif;padding:13px 20px;border-radius:99px;box-shadow:0 12px 30px rgba(0,0,0,.35);transition:.3s;z-index:70;opacity:0}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
@media (max-width:820px){.stage{grid-template-columns:1fr;gap:6px;text-align:center}.sheet p{margin-inline:auto}.podium{height:min(34svh,290px);order:-1}.sheet h2{font-size:clamp(36px,10vw,52px)}}
@media (prefers-reduced-motion:reduce){.podium img{transition:none}}
</style>
</head>
<body>
<span class="badge">OPTION A · CHARACTER SELECT</span>
<a class="backlink" href="index.html">Back to site</a>
<div class="stagewrap">
  <div class="stagehead">
    <span class="kick">Meet the characters</span>
    <h1>Pick who your child talks to.</h1>
  </div>
  <div class="stage">
    <div class="podium"><img id="bigchar" src="assets/img/live/char-cheeko.png" alt="Cheeko the fox" /></div>
    <div class="sheet">
      <span class="chip" id="chip">In every Cheeko</span>
      <h2 id="cname">Cheeko</h2>
      <div class="role" id="crole">The fox</div>
      <p id="cline">Press the button, ask anything. He answers in your family's language.</p>
      <button class="hearbtn" id="hear"><i>▶</i> Hear me</button>
    </div>
  </div>
  <div class="selectrail" id="rail"></div>
</div>
<div class="toast" id="toast">Real voices land before launch</div>
<script>
var CH=[
 {k:"cheeko",n:"Cheeko",r:"The fox",c:"In every Cheeko",l:"Press the button, ask anything. He answers in your family's language."},
 {k:"quizzy",n:"Quizzy Bee",r:"The quiz bee",c:"In every Cheeko",l:"Ten quick questions a day. No scores, no pressure."},
 {k:"nani",n:"Nani",r:"The storyteller",c:"In your box",l:"Tells stories your child can interrupt, question and steer."},
 {k:"mitthu",n:"Mitthu",r:"The spelling parrot",c:"In your box",l:"Says a word. Your child spells it back."},
 {k:"chanda",n:"Chanda",r:"The bedtime panda",c:"In the card shop",l:"Slow stories and soft songs to end the day."},
 {k:"masti",n:"Masti",r:"The mischief monkey",c:"In the card shop",l:"Jokes, games and giggly challenges."},
 {k:"tara",n:"Tara",r:"The space star",c:"In the card shop",l:"Space, stars and the biggest why questions."}
];
var rail=document.getElementById("rail"),big=document.getElementById("bigchar");
var idx=0,timer=null,touched=false;
CH.forEach(function(ch,i){
  var b=document.createElement("button");
  b.innerHTML='<img src="assets/img/live/char-'+ch.k+'.png" alt="'+ch.n+'">';
  b.addEventListener("click",function(){touched=true;clearInterval(timer);show(i);});
  rail.appendChild(b);
});
function show(i){
  idx=i;var ch=CH[i];
  big.classList.add("swap");
  setTimeout(function(){
    big.src="assets/img/live/char-"+ch.k+".png";big.alt=ch.n;
    document.getElementById("cname").textContent=ch.n;
    document.getElementById("crole").textContent=ch.r;
    document.getElementById("chip").textContent=ch.c;
    document.getElementById("cline").textContent=ch.l;
    big.classList.remove("swap");
  },180);
  rail.querySelectorAll("button").forEach(function(b,j){b.classList.toggle("on",j===i);});
}
show(0);
if(!window.matchMedia("(prefers-reduced-motion: reduce)").matches){
  timer=setInterval(function(){if(!touched)show((idx+1)%CH.length);},3000);
}
document.getElementById("hear").addEventListener("click",function(){
  var a=new Audio("assets/audio/voice-"+CH[idx].k+".mp3");
  a.play().catch(function(){var t=document.getElementById("toast");t.classList.add("show");setTimeout(function(){t.classList.remove("show");},2200);});
});
</script>
</body>
</html>
